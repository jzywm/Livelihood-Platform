# ============================================================
# CodeQL SAST 强化 (G2 补充)
# - PR 上自动增量分析
# - main 上全量分析
# - 每周一 03:00 全量定时扫描 (防漏网)
# 复制到仓库: .github/workflows/codeql-analysis.yml
# ============================================================
name: codeql-analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  security-events: write   # 上传 SARIF 结果到 Security 标签页

jobs:
  analyze:
    name: CodeQL Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript", "python"]  # 按项目语言调整
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality   # 安全+质量查询集
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
