      properties:
        merchantId:
          type: string
          example: m_20260825001
        updatedAt:
          type: string
          format: date-time
          description: 更新时间（留痕）
          example: '2026-01-15T10:30:00Z'
    PriceListItem:
      type: object
      required: [name, price]
      properties:
        name:
          type: string
          description: 服务/商品名称
          example: 农药(除草剂)
        spec:
          type: string
          description: 规格
          example: 500ml/瓶
        unit:
          type: string
          description: 计价单位
          example: 瓶
        price:
          type: number
          minimum: 0
          description: 价格（元；同品同价，不杀熟）
          example: 15.5
    PriceListUpdateRequest:
      type: object
      required: [items, version]
      properties:
        items:
          type: array
          description: 价目条目
          items:
            $ref: '#/components/schemas/PriceListItem'
        version:
          type: integer
          format: int32
          description: 乐观锁版本号（不匹配 → 3007 冲突）
          example: 3
    PriceListResult:
      type: object
      required: [version, updatedAt]
      properties:
        items:
          type: array
          description: 价目条目（已公示）
