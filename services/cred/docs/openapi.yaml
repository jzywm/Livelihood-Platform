    ScoreMineResult:
      allOf:
        - $ref: '#/components/schemas/CreditScoreResult'
        - type: object
          properties:
            deductions:
              type: array
              description: 扣分明细（可申诉）
              items:
                $ref: '#/components/schemas/ScoreDeduction'
    RedBlackItem:
      type: object
      required: [subjectId, name, subjectType, score, listType]
      properties:
        subjectId:
          type: string
          example: m_20260825001
        name:
          type: string
          description: 主体名称（脱敏公示，R-03）
          example: 张*饭馆
        subjectType:
          $ref: '#/components/schemas/ScoreSubjectType'
        score:
          type: number
          format: float
          minimum: 0
          maximum: 100
          example: 90
        listType:
          type: string
          description: 红榜/黑榜
          enum: [RED, BLACK]
          example: RED
        reason:
          type: string
          description: 上榜原因（脱敏）
          example: 放心供应商
        updatedAt:
          type: string
          format: date-time
          example: '2026-01-15T10:30:00Z'
    RedBlackPage:
      allOf:
        - $ref: '../../_common/openapi.yaml#/components/schemas/PageResult'
        - type: object
          properties:
            list:
              type: array
              items:
                $ref: '#/components/schemas/RedBlackItem'

x-external-interfaces:
  description: |
    服务端间接口（内部调用），前端勿调，不在上方 paths 中。
    出方向依赖：
    - 证照临期/年检/投诉激增异常标记每日扫描 → 推送 DASH（A-08 预警聚合）与站内信双向触达；
    - 档案核验 OCR 预审调用 AICORE（K-01）；
    - 扣分申诉复用 TICKET D-03 机制（本服务不建第二套申诉）。
  endpoints:
    - method: POST
      path: /cred/score/events
      tags: [score]
      summary: 评分事件上报（服务端间，EMP/TRADE/TICKET/AICORE → CRED）
      description: |
        其他服务上报评分事件（SSOT §3 交叉职责矩阵：EMP 劳务互评、TRADE 交易互评、TICKET 投诉扣分、
        AICORE 视觉审核结论），CRED 统一计算/存储信用分（credit_score 唯一权威存储）；
        禁止跨服务直接写表。服务端间鉴权（内部 Token）+ 幂等。前端永远不调用此接口。
      requestBody:
        description: 评分事件（服务端间报文）
        content:
          application/json:
            schema:
              type: object
              required: [subjectId, subjectType, eventType, points, source, bizId]
              properties:
                subjectId:
                  type: string
                  description: 主体编号
                subjectType:
                  $ref: '#/components/schemas/ScoreSubjectType'
                eventType:
                  type: string
                  description: 事件类型（如 COMPLAINT_RESOLVED / TRADE_REVIEW / LABOR_REVIEW / VISION_VERDICT）
                points:
                  type: number
                  description: 分值变动（正负）
                source:
                  type: string
                  description: 来源服务（EMP/TRADE/TICKET/AICORE）
                bizId:
                  type: string
                  description: 来源业务单号（幂等）
      responses:
        '200':
          description: 受理成功（异步计算信用分）
          content:
            application/json:
              schema:
                $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
    - method: POST
      path: /cred/score/supplier
      tags: [score]
      summary: 供应商信用分回写（服务端间，TRACE → CRED）
      description: |
        TRACE 按 T-05 公式（资质 30% + 履约 30% + 口碑 30% + 贡献 10%）计算供应商信用分后回写 CRED
        存储与公示（SSOT C-02 已决策）；放心供应商标识由 TRACE 动态授予/撤销、CRED 存储公示。
        服务端间鉴权 + 幂等。前端永远不调用此接口。
      requestBody:
        description: 供应商信用分回写（服务端间报文）
        content:
          application/json:
            schema:
              type: object
              required: [supplierId, score, dims]
              properties:
                supplierId:
                  type: string
                  description: 供应商编号
                score:
                  type: number
                  minimum: 0
                  maximum: 100
                  description: 信用分
                dims:
                  type: array
                  description: 四维构成（资质/履约/口碑/贡献）
                  items:
                    $ref: '#/components/schemas/ScoreDim'
                trusted:
                  type: boolean
                  description: 放心供应商标识（TRACE 动态授予/撤销）
      responses:
        '200':
          description: 受理成功（存储 + 公示更新）
          content:
            application/json:
              schema:
                $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
