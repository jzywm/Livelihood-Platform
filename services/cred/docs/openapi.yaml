          $ref: '#/components/schemas/MerchantArchive'
        priceList:
          $ref: '#/components/schemas/PriceListResult'
        commitment:
          $ref: '#/components/schemas/CommitmentResult'
        ageGate:
          $ref: '#/components/schemas/AgeGateResult'
    MerchantUpdateRequest:
      type: object
      description: 档案维护（A-03，至少提交一个更新项）
      properties:
        licenseImageKey:
          type: string
          description: 更新后的营业执照图像（OCR 预审）
        permitImageKey:
          type: string
          description: 更新后的许可证图像
        scope:
          type: string
          maxLength: 2000
          description: 经营范围
        contact:
          type: string
          maxLength: 100
          description: 联系方式（可选，脱敏存储）
    MerchantUpdateResult:
      type: object
