      enum: [MERCHANT, PERSON, SUPPLIER]
      example: MERCHANT
    ScoreDim:
      type: object
      required: [name, score]
      properties:
        name:
          type: string
          description: 维度名（M1 基础合规 + 经营行为；权重已定档 2026-09-11：基础合规 0.6 / 经营行为 0.4）
          example: 基础合规
        weight:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: 权重（0-1；M1 两维 = 基础合规 0.6 + 经营行为 0.4，2026-09-11 定档）
          example: 0.6
        score:
          type: number
          format: float
          minimum: 0
          maximum: 100
