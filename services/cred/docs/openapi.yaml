        startDate:
          type: string
          format: date
          example: '2025-03-01'
        endDate:
          type: string
          format: date
          description: 离职日期（在职为空）
          example: '2026-01-31'
    PersonDetail:
      type: object
      required: [personId, name, occupation]
      properties:
        personId:
          type: string
          example: p_20260115001
        name:
          type: string
          description: 姓名（脱敏展示）
          example: 李*华
        occupation:
          type: string
          example: 厨师
        healthCert:
          type: object
          description: 健康证核验状态
