      properties:
        subjectId:
          type: string
          example: m_20260825001
        subjectType:
          $ref: '#/components/schemas/ScoreSubjectType'
        score:
          type: number
          format: float
          minimum: 0
          maximum: 100
          example: 90
        dims:
          type: array
          description: 维度构成（脱敏可查）
          items:
            $ref: '#/components/schemas/ScoreDim'
        updatedAt:
          type: string
          format: date-time
          example: '2026-01-15T10:30:00Z'
    ScoreDeduction:
      type: object
