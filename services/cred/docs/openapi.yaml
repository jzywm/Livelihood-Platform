          items:
            type: string
        inspections:
          type: array
          description: 抽检结果（脱敏公示）
          items:
            type: string
        complaintRate:
          type: number
          format: float
          minimum: 0
          maximum: 1
          example: 0.01
        reviewRate:
          type: number
          format: float
          minimum: 0
          maximum: 1
          example: 0.95
        creditScore:
          type: number
          format: float
          minimum: 0
          maximum: 100
          example: 90
        anomalyTags:
          type: array
