[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aicore"
version = "0.1.0"
description = "AI 能力中心服务（AICORE）· 民生甄选平台"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.53",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "sqlalchemy>=2.0.54",
    "pymysql>=1.2",
    "redis>=8.1",
    "httpx>=0.28",
    "alembic>=1.20",
    "structlog>=24.0",
    "cryptography>=50.0",
    "pillow>=12.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "import-linter>=2.15",
    "ruff>=0.16",
    "mypy>=2.3",
    # tests/conftest.py 的 anyio_backend 夹具是 brief 强制项；
    # anyio 此前只是 pytest-asyncio 的传递依赖，显式声明后夹具才有直接的依赖归属（Task 1.4 继续扩展该文件）。
    "anyio>=4.15",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
# 注释与文档使用中文是本仓库的强制要求（DEVELOPMENT_CONSTRAINTS.md §2）。
# 注意：不要用 ignore 关闭 RUF001/RUF002/RUF003 —— 那会连带关掉字符串字面量里的
# 易混字符检测，而那里才是该规则安全价值最高的地方（西里尔字母 а、全角数字
# 悄悄混进环境变量名 / 字典键 / 断言字符串时，只有这三条规则能发现）。
# 因此改为逐个放行中文文档实际用到的全角标点，规则本身全部保持开启：
#   （ U+FF08 全角左括号    ） U+FF09 全角右括号
#   ： U+FF1A 全角冒号      ； U+FF1B 全角分号
#   ， U+FF0C 全角逗号
# 本集合的确定方法（可复现，非凭感觉）：统计后续任务简报与 VENV.md 中出现的
# 全角/表意标点字符集，得到 7 个（、。，（）:；）；再用 ruff 实测哪些真正触发
# RUF001/2/3 —— 只有 、（U+3001）之外的 ，：；（） 会触发，。与、不触发。
# 这里放行全部 7 个，使后续任务写中文 docstring 时不会逐字符踩坑。
# 它们只出现在中文注释与 docstring 中，不参与标识符与键值，放行无安全代价：
# 西里尔字母、全角数字等真正的易混字符仍在检测范围内。
allowed-confusables = ["、", "。", "（", "）", "，", "：", "；"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["tests.*"]
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    "integration: 需要真实 MySQL / Redis 的端到端用例，默认不执行",
]
# 定向静默两条**来自第三方库内部**的弃用警告，使测试输出保持干净。
# 两条都不是本项目代码的问题，且都无法在不改依赖的前提下修掉：
#   1) fastapi/testclient.py:1 —— starlette 的 StarletteDeprecationWarning，提示
#      「用 httpx 已弃用，建议装 httpx2」。本项目不引入 httpx2（见设计文档偏差 V2）。
#      httpx2 落地后删除本行。
#   2) starlette/testclient.py:53 —— anyio.abc.BlockingPortal 别名弃用，位于 starlette 自身源码内。
# 只按 message 精确匹配，不整类静默 DeprecationWarning，以免掩盖本项目引入的新警告。
#
# 为什么不加 "error" 兜底：这两条警告由 conftest 在**导入期**触发（fixture 内延迟导入
# TestClient 已实测无法规避——warnings.warn 发生在 starlette 模块层），而 pytest 应用
# filterwarnings 的时机在 conftest 导入之后，故 "error" 会在收集阶段直接报错（exit 4），
# 而非在本项目的用例上失败。若将来要让新警告失败，应在 CI 层用 `-W error` 并排除这两条。
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated",
]

[tool.coverage.run]
source = ["src/aicore"]
omit = ["src/aicore/main.py", "src/aicore/provider/deepseek.py", "src/aicore/provider/cloud_vision.py", "src/aicore/provider/cloud_ocr.py"]

[tool.coverage.report]
fail_under = 80
