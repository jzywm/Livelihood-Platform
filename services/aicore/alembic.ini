# AICORE Alembic config (Task 3.5).
#
# WHY THIS FILE IS ASCII-ONLY (do not "fix" this by adding Chinese here):
#   alembic 1.20 reads this file with `encoding="locale"`
#   (alembic/util/compat.py: read_config_parser -> file_config.read(path, encoding="locale")).
#   On Windows the ANSI code page here is 936, so a UTF-8 file with non-ASCII bytes makes
#   configparser raise UnicodeDecodeError('gbk' codec can't decode ...) and EVERY alembic
#   command dies before env.py even loads -- even with PYTHONUTF8=1, because "locale"
#   explicitly asks for the locale codec. ASCII is the only encoding-safe choice here.
#   The Chinese documentation for this directory lives in:
#       deploy/sql/migration/README   (how to add a migration, shard tables, drill DB)
#       deploy/sql/migration/env.py   (URL resolution, autogenerate filters, downgrade guard)
#
# Usage (working directory = services/aicore):
#   .venv\Scripts\python.exe -m alembic -c alembic.ini upgrade head
#   .venv\Scripts\python.exe -m alembic -c alembic.ini revision --autogenerate -m "xxx"
#
# The password is NEVER stored here (this file is committed): `sqlalchemy.url` is left
# empty on purpose and env.py builds the real URL from environment variables
# (drill DB via DSH_IT_MYSQL_*, otherwise app config AICORE_MYSQL_*).
#
# `%(here)s` is the directory holding this file (an interpolation provided by alembic),
# so `-c <path>/alembic.ini` always targets that service root, whatever the shell cwd is.

[alembic]
# Migration script directory (env.py / script.py.mako / README / versions live here).
script_location = %(here)s/deploy/sql/migration
# Version files live here. This is the ONLY migration directory: new revisions go here.
version_locations = %(here)s/deploy/sql/migration/versions
# Make `import aicore` work on machines that only have the src/ layout (no install).
prepend_sys_path = %(here)s/src
# How multi-path options above are split. `os` = os.pathsep (";" on Windows, ":" elsewhere).
# Without it alembic 1.20 emits a DeprecationWarning and falls back to splitting on
# spaces/commas/colons -- and a colon-split would tear "D:\progrom\..." apart on Windows.
path_separator = os
# Intentionally empty: the real URL is assembled in env.py from env vars (see header).
sqlalchemy.url =

# ---- post write hooks: keep every generated revision lint-clean ----
# `alembic revision` renders ops in a layout that violates this repo's ruff gate:
#   E501 on long sa.Column(...) lines, W291 on an empty "Revises:", I001 import order.
# Running the formatter here is the documented alembic mechanism, and it keeps the
# revision step reproducible: every future migration lands lint-clean instead of
# depending on someone remembering to run ruff afterwards.
# `type = module` executes `python -m ruff ...` with the very interpreter running
# alembic, so no absolute path to ruff.exe is baked into this committed file.
[post_write_hooks]
hooks = ruff_format, ruff_lint
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_lint.type = module
ruff_lint.module = ruff
ruff_lint.options = check --fix REVISION_SCRIPT_FILENAME

# ---- logging (alembic convention, consumed by env.py's fileConfig call) ----
# Without this section `upgrade head` prints nothing at all ("Running upgrade ..." is an
# alembic INFO log), so operators cannot tell from the output whether it ran, or where.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
