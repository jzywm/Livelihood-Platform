openapi: 3.0.3
info:
  title: AI 能力中心 AICORE · 接口文档
  version: 1.0.0
  description: |
    AI 能力中心（AICORE）前端接口文档。模块 K：证照 OCR（K-01）、AI 网关底座（K-02）、
    视觉合规审核工作台（K-03）、图像问答（K-04）、后厨直播异常识别（K-05）、风险预测预警（K-06）。
    口径对齐：PDD §5.12 / §6.4.13（接口草案扩展为异步任务 + 人工复核闭环）；需求口径 PRD §5.13（K 组）、
    `29-AI能力中心需求.md`、功能列表 K-01~K-06。
    - 本文件 paths 仅含前端可调接口，可直接喂 packages/api-client 生成 TS 类型。
    - 服务端间接口（直播帧识别任务、批量风险扫描）见文末 x-external-interfaces 附录，前端勿调。
    - 公共组件（Envelope / PageResult / 错误码 / 分页 / 鉴权）引用 ../../_common/openapi.yaml，勿复制内联。
    - 平台红线：AI 只标记不决策（C8）；图像脱敏前置（去人脸/车牌，R-05）；云视觉不用于训练、数据不出域；
      复核结果只用于平台调优、不回流第三方。里程碑标注：【M1】网关+OCR、【M2】视觉审核/图像问答/后厨识别、【M3】风险预测。
servers:
  - url: https://api.example.com/api/v1
    description: 生产（示例域名）
  - url: http://localhost:8000/api/v1
    description: 本地开发（Python FastAPI）
tags:
  - name: ocr
    description: 证照 OCR 自动核验（K-01）
  - name: task
    description: 异步任务查询（K-02 AI 网关底座）
  - name: vision
    description: 视觉合规审核工作台（K-03）
  - name: qa
    description: 图像问答（K-04）
  - name: kitchen
    description: 后厨直播异常识别（K-05）
  - name: risk
    description: 风险预测预警（K-06）

security:
  - bearerAuth: []

paths:
  /aicore/ocr:
    post:
      tags: [ocr]
      summary: 提交证照 OCR 核验任务【M1 · K-01】
      description: |
        证照（营业执照/许可证/检测报告）上传后自动提取字段、比对有效期/类目（K-01），减少 A-01 人工核验量。
        经营端上传预审 + 监管端核验双端复用。imageKey 为前端 OSS 直传后的对象键，图像服务端脱敏（去人脸/车牌）
        后送 OCR 通道，识别结果仅预审、人工核验兜底（C8）。
        异步任务化：受理即返回 taskId，前端轮询 GET /aicore/tasks/{taskId} 取结果（任务结果 = OcrResult）。
        异常：OCR 通道失败/超时（4003）→ 任务降级转人工核验队列，不阻塞入驻流程；图像模糊 → 结果提示重传。
        幂等：同 imageKey 同 docType 重复提交返回原任务号（支持 Idempotency-Key 头）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OcrRequest'
      responses:
        '200':
          description: 受理成功，返回任务号（异步处理）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TaskAccepted'
        '400':
          $ref: '../../_common/openapi.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../_common/openapi.yaml#/components/responses/Forbidden'
        '429':
          description: 触发限流（Redis 令牌桶按账号限流，成本护栏）
          content:
            application/json:
              schema:
                $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
        '502':
          description: OCR 通道失败或超时（code=4003，任务降级转人工核验队列）
          content:
            application/json:
              schema:
                $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
              example:
                code: 4003
                message: OCR 通道失败或超时，已转人工核验
                data: null
                traceId: 3f2a1b9c8d7e6f50
                timestamp: '2026-01-15T10:30:00Z'
  /aicore/tasks/{taskId}:
    get:
      tags: [task]
      summary: 查询异步 AI 任务进度与结果【M1 · K-02】
      description: |
        统一任务队列与结果回执（K-02）：所有异步 AI 任务（OCR/视觉审核/后厨识别/风险预测）经此接口轮询。
        仅可查询本人（本账号）提交的任务，跨账号访问报 2002。
        status=PROCESSING 时 result 为空；SUCCEEDED 时 result 按 type 返回对应结构；
        FAILED 时返回 errorCode（4003 通道失败已转人工队列 / 5002 依赖超时等）。
      parameters:
        - name: taskId
          in: path
          required: true
          description: 任务号（提交接口返回）
          schema:
            type: string
            example: task_9f2e7c1a3b4d5e6f
      responses:
        '200':
          description: 成功，返回任务状态与结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TaskResult'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../_common/openapi.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../../_common/openapi.yaml#/components/responses/NotFound'
  /aicore/vision/reviews:
    post:
      tags: [vision]
      summary: 提交视觉合规审核任务【M2 · K-03】
      description: |
        监管端上传原材料/证照/抽检图像（1~9 张，OSS 对象键），系统脱敏（去人脸/车牌）后送云视觉分析
        （签数据合规协议：不用于训练、数据不出域），产出疑似问题标记 + 置信度分级
        （高 ≥0.9 / 中 0.7~0.9 / 低 <0.7，建议初值、上线前评审）。
        异步任务化：受理返回 taskId，轮询 GET /aicore/tasks/{taskId} 拿 VisionReviewResult（含 reviewId）；
        AI 分析完成后记录进入工作台（GET /aicore/vision/reviews），由人工复核（POST …/verdict）。
        AI 只输出疑似标记不决策（C8）；图像留存：复核完成归档 180 天、失败/忽略样本 30 天。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisionReviewSubmitRequest'
      responses:
        '200':
          description: 受理成功，返回任务号（异步处理）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TaskAccepted'
        '400':
          $ref: '../../_common/openapi.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../_common/openapi.yaml#/components/responses/Forbidden'
        '502':
          description: 视觉通道失败或超时（code=4003，任务进人工复核队列原样流转，AI 标记缺席不阻塞）
          content:
            application/json:
              schema:
                $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
              example:
                code: 4003
                message: 视觉 API 失败或超时，已转人工复核队列
                data: null
                traceId: 3f2a1b9c8d7e6f50
                timestamp: '2026-01-15T10:30:00Z'
    get:
      tags: [vision]
      summary: 视觉审核工作台列表【M2 · K-03】
      description: |
        监管端工作台队列：按状态（待复核/已确认/已核查/已驳回/已归档）、置信度分级、业务类型、时间范围筛选。
        高置信 → 人工确认/一键核查单；中置信 → 复核队列；低置信 → 归档。
        需监管角色（RBAC），跨端越权报 2002。
      parameters:
        - $ref: '../../_common/openapi.yaml#/components/parameters/Page'
        - $ref: '../../_common/openapi.yaml#/components/parameters/PageSize'
        - name: status
          in: query
          required: false
          description: 复核状态筛选
          schema:
            $ref: '#/components/schemas/VisionReviewStatus'
        - name: confidenceLevel
          in: query
          required: false
          description: 置信度分级筛选（HIGH/MEDIUM/LOW）
          schema:
            $ref: '#/components/schemas/ConfidenceLevel'
        - name: bizType
          in: query
          required: false
          description: 业务类型筛选
          schema:
            $ref: '#/components/schemas/VisionBizType'
        - name: merchantKeyword
          in: query
          required: false
          description: 商户名称/编号模糊搜索
          schema:
            type: string
            maxLength: 50
        - name: from
          in: query
          required: false
          description: 提交时间起（含）
          schema:
            type: string
            format: date
            example: '2026-01-01'
        - name: to
          in: query
          required: false
          description: 提交时间止（含）
          schema:
            type: string
            format: date
            example: '2026-01-31'
      responses:
        '200':
          description: 成功，返回工作台队列（分页）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/VisionReviewPage'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../_common/openapi.yaml#/components/responses/Forbidden'
  /aicore/vision/reviews/{reviewId}:
    get:
      tags: [vision]
      summary: 视觉审核详情（疑似标记列表）【M2 · K-03】
      description: |
        单条审核详情：疑似问题标记（label/置信度/位置框/处置建议）+ 复核留痕（谁核、何时、结论）。
        标记可见、置信度可见、复核结论可查（透明五词）。需监管角色。
      parameters:
        - name: reviewId
          in: path
          required: true
          description: 审核记录号
          schema:
            type: string
            example: rev_c1d2e3f4a5b6
      responses:
        '200':
          description: 成功，返回标记详情与复核留痕
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/VisionReviewDetail'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../_common/openapi.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../../_common/openapi.yaml#/components/responses/NotFound'
  /aicore/vision/reviews/{reviewId}/verdict:
    post:
      tags: [vision]
      summary: 提交人工复核结论【M2 · K-03】
      description: |
        人工复核留痕（K-03 闭环 + C8）：监管人员对 AI 疑似标记作出结论——
        CONFIRM 确认（结论异步写入 A-02 商户档案与信用分，见附录出方向说明）、
        REFER 一键生成核查单、REJECT 驳回误报、ARCHIVE 归档（低置信忽略）。
        复核结论只用于平台自建评估集调优阈值，不回流第三方模型训练。
        已复核（非 PENDING）记录重复提交报 3007；复核人、时间、结论全链路审计。
        需监管角色；敏感操作（REFER 生成核查单）需二次确认。
      parameters:
        - name: reviewId
          in: path
          required: true
          description: 审核记录号
          schema:
            type: string
            example: rev_c1d2e3f4a5b6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerdictRequest'
      responses:
        '200':
          description: 成功，返回复核结论与审计留痕
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/VerdictResult'
        '400':
          $ref: '../../_common/openapi.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../_common/openapi.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../../_common/openapi.yaml#/components/responses/NotFound'
        '422':
          description: 状态不允许（code=3007，记录已复核，不可重复提交）
          content:
            application/json:
              schema:
                $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
              example:
                code: 3007
                message: 状态不允许该操作
                data: null
                traceId: 3f2a1b9c8d7e6f50
                timestamp: '2026-01-15T10:30:00Z'
  /aicore/vision/qa:
    post:
      tags: [qa]
      summary: 图像问答（拍照提问）【M2 · K-04】
      description: |
        消费/经营端拍照提问（如「这袋化肥包装合规吗」「这个食材新鲜吗」），系统脱敏（去人脸/车牌）后
        调视觉模型辅助回答。同步短应答（P95 ≤3s），超时/无法判断 → 提示「仅辅助判断」并引导转人工/投诉入口。
        受 J 组对话合规约束（内容安全过滤、限流防滥用）；回答仅辅助判断、不作执法/鉴定结论（C8），
        返回 disclaimer 字段前端必须展示。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisionQaRequest'
      responses:
        '200':
          description: 成功，返回辅助判断答案与置信度
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/VisionQaResult'
        '400':
          $ref: '../../_common/openapi.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
        '429':
          description: 触发限流（Redis 令牌桶按账号限流，防滥用）
          content:
            application/json:
              schema:
                $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
        '502':
          description: 视觉通道失败或超时（code=4003，前端引导转人工/投诉入口）
          content:
            application/json:
              schema:
                $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
              example:
                code: 4003
                message: 视觉 API 失败或超时，请转人工/投诉入口
                data: null
                traceId: 3f2a1b9c8d7e6f50
                timestamp: '2026-01-15T10:30:00Z'
  /aicore/kitchen/anomalies:
    get:
      tags: [kitchen]
      summary: 后厨直播异常标记列表【M2 · K-05】
      description: |
        监管端查看后厨直播画面级异常标记（未穿工装/卫生问题/明火离人等），需商户已授权接入（B-04）。
        帧识别任务由服务端间接口提交（见 x-external-interfaces 附录），标记进复核流后复用
        POST /aicore/vision/reviews/{reviewId}/verdict 人工复核；处置人工确认、不自动处罚（C8）。
        需监管角色。
      parameters:
        - $ref: '../../_common/openapi.yaml#/components/parameters/Page'
        - $ref: '../../_common/openapi.yaml#/components/parameters/PageSize'
        - name: status
          in: query
          required: false
          description: 复核状态筛选
          schema:
            $ref: '#/components/schemas/KitchenAnomalyStatus'
        - name: merchantKeyword
          in: query
          required: false
          description: 商户名称/编号模糊搜索
          schema:
            type: string
            maxLength: 50
        - name: from
          in: query
          required: false
          description: 检出时间起（含）
          schema:
            type: string
            format: date
            example: '2026-01-01'
        - name: to
          in: query
          required: false
          description: 检出时间止（含）
          schema:
            type: string
            format: date
            example: '2026-01-31'
      responses:
        '200':
          description: 成功，返回异常标记列表（分页）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/KitchenAnomalyPage'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../_common/openapi.yaml#/components/responses/Forbidden'
  /aicore/risk/merchants:
    get:
      tags: [risk]
      summary: 风险商户预测列表【M3 · K-06 占位】
      description: |
        监管端查看平台自建风险模型（数据不出域）预测的风险商户（欠薪/假货风险），基于信用/交易/抽检/投诉数据。
        预警触发人工处置（AI 只输出风险建议、人工决策执行，C8），联动 DASH A-08 分级监管。
        需监管角色；预警准确率作为业务级监控指标。
      parameters:
        - $ref: '../../_common/openapi.yaml#/components/parameters/Page'
        - $ref: '../../_common/openapi.yaml#/components/parameters/PageSize'
        - name: riskLevel
          in: query
          required: false
          description: 风险等级筛选
          schema:
            $ref: '#/components/schemas/RiskLevel'
        - name: merchantKeyword
          in: query
          required: false
          description: 商户名称/编号模糊搜索
          schema:
            type: string
            maxLength: 50
        - name: from
          in: query
          required: false
          description: 预测时间起（含）
          schema:
            type: string
            format: date
            example: '2026-01-01'
        - name: to
          in: query
          required: false
          description: 预测时间止（含）
          schema:
            type: string
            format: date
            example: '2026-01-31'
      responses:
        '200':
          description: 成功，返回风险商户列表（分页）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RiskMerchantPage'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../_common/openapi.yaml#/components/responses/Forbidden'
  /aicore/risk/predict:
    post:
      tags: [risk]
      summary: 单商户风险预测【M3 · K-06 占位】
      description: |
        监管端对指定商户即时触发风险预测（平台自建模型、基于平台数据不出域）。
        返回风险分、风险等级、风险因子与处置建议；AI 输出风险建议、人工决策执行（C8）。
        需监管角色。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskPredictRequest'
      responses:
        '200':
          description: 成功，返回风险预测结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RiskPredictResult'
        '400':
          $ref: '../../_common/openapi.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../_common/openapi.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../../_common/openapi.yaml#/components/responses/NotFound'

components:
  schemas:
    DocType:
      type: string
      description: 证照类型（K-01）
      enum: [BUSINESS_LICENSE, PERMIT, INSPECTION_REPORT]
      example: BUSINESS_LICENSE
    OcrScene:
      type: string
      description: OCR 应用场景（经营端入驻/证照更新、监管端核验）
      enum: [MERCHANT_ONBOARDING, CERT_RENEWAL, SUPERVISOR_REVIEW]
      example: MERCHANT_ONBOARDING
    OcrRequest:
      type: object
      required: [imageKey, docType]
      properties:
        imageKey:
          type: string
          description: 证照图像 OSS 对象键（前端 OSS 直传后回传）
          example: cert/oss/2026/01/abc123.jpg
        docType:
          $ref: '#/components/schemas/DocType'
        scene:
          $ref: '#/components/schemas/OcrScene'
    OcrField:
      type: object
      required: [fieldName, value, confidence]
      properties:
        fieldName:
          type: string
          description: 字段名（统一社会信用代码/名称/法定代表人/有效期至/经营范围等）
          example: 统一社会信用代码
        value:
          type: string
          description: 识别值（脱敏输出）
          example: 911301********1234
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: 单字段识别置信度
          example: 0.98
    MatchResult:
      type: object
      required: [validity, categoryMatch, summary]
      properties:
        validity:
          type: string
          description: 有效期比对结果（对含有效期字段的证照）
          enum: [VALID, EXPIRING, EXPIRED, UNKNOWN]
          example: VALID
        categoryMatch:
          type: boolean
          description: 经营范围/类目比对是否匹配
          example: true
        summary:
          type: string
          description: 一句话核验结论（面向人工核验）
          example: 证照在有效期内，经营范围与申报类目一致
        suggestions:
          type: array
          description: 人工核验提示（如「有效期不足 90 天」「类目不符，请人工核对」）
          items:
            type: string
    OcrResult:
      type: object
      required: [fields, matchResult]
      properties:
        fields:
          type: array
          description: 结构化提取字段
          items:
            $ref: '#/components/schemas/OcrField'
        matchResult:
          $ref: '#/components/schemas/MatchResult'
        needsManualReview:
          type: boolean
          description: 识别置信度不足，需转人工核验兜底
          example: false
    TaskType:
      type: string
      description: 异步任务类型（K-02 统一队列）
      enum: [OCR, VISION_REVIEW, KITCHEN_ANOMALY, RISK_PREDICT]
      example: OCR
    TaskStatus:
      type: string
      description: 任务状态
      enum: [PROCESSING, SUCCEEDED, FAILED, MANUAL_REVIEW]
      example: SUCCEEDED
    TaskAccepted:
      type: object
      required: [taskId, status]
      properties:
        taskId:
          type: string
          description: 任务号，轮询 GET /aicore/tasks/{taskId}
          example: task_9f2e7c1a3b4d5e6f
        status:
          type: string
          description: 受理状态（固定 PROCESSING）
          enum: [PROCESSING]
          example: PROCESSING
    TaskResult:
      type: object
      required: [taskId, type, status, createdAt]
      properties:
        taskId:
          type: string
          example: task_9f2e7c1a3b4d5e6f
        type:
          $ref: '#/components/schemas/TaskType'
        status:
          $ref: '#/components/schemas/TaskStatus'
        progress:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: 进度百分比（0-100）
          example: 100
        result:
          description: 任务结果，按 type 区分；PROCESSING 时为空，FAILED 时为空
          oneOf:
            - $ref: '#/components/schemas/OcrResult'
            - $ref: '#/components/schemas/VisionReviewResult'
            - $ref: '#/components/schemas/KitchenAnomalyResult'
            - $ref: '#/components/schemas/RiskPredictResult'
        errorCode:
          type: string
          description: FAILED 时的业务码（如 4003 通道失败已转人工 / 5002 依赖超时）
          example: '4003'
        createdAt:
          type: string
          format: date-time
          description: 提交时间
          example: '2026-01-15T10:30:00Z'
        finishedAt:
          type: string
          format: date-time
          description: 完成时间（SUCCEEDED/FAILED/MANUAL_REVIEW 时）
          example: '2026-01-15T10:30:05Z'
    VisionBizType:
      type: string
      description: 视觉审核业务类型（K-03；KITCHEN 复用 K-05 标记）
      enum: [RAW_MATERIAL, CERTIFICATE, INSPECTION_SAMPLE, KITCHEN]
      example: RAW_MATERIAL
    VisionReviewSubmitRequest:
      type: object
      required: [images, bizType]
      properties:
        images:
          type: array
          minItems: 1
          maxItems: 9
          description: 图像 OSS 对象键（1~9 张，服务端脱敏后送云视觉）
          items:
            type: string
            example: review/oss/2026/01/img001.jpg
        bizType:
          $ref: '#/components/schemas/VisionBizType'
        merchantId:
          type: string
          description: 关联商户（结论回写 A-02 档案与信用分）
          example: m_20260825001
        batchId:
          type: string
          description: 关联溯源批次（抽检图像）
          example: b_20260801001
    ConfidenceLevel:
      type: string
      description: 置信度分级（建议初值：高 ≥0.9 / 中 0.7~0.9 / 低 <0.7，上线前评审，阈值可调）
      enum: [HIGH, MEDIUM, LOW]
      example: HIGH
    VisionReviewStatus:
      type: string
      description: 视觉审核记录状态（AI_PROCESSING 分析中 → PENDING 待复核 → 人工结论）
      enum: [AI_PROCESSING, PENDING, CONFIRMED, REFERRED, REJECTED, ARCHIVED]
      example: PENDING
    VisionReviewResult:
      type: object
      required: [reviewId, confidenceLevel, confidence, markersCount]
      properties:
        reviewId:
          type: string
          description: 审核记录号（工作台查询/复核用）
          example: rev_c1d2e3f4a5b6
        confidenceLevel:
          $ref: '#/components/schemas/ConfidenceLevel'
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: 最高标记置信度
          example: 0.93
        markersCount:
          type: integer
          format: int32
          description: 疑似标记数量
          example: 3
    VisionReviewItem:
      type: object
      required: [reviewId, bizType, imageKeys, status, createdAt]
      properties:
        reviewId:
          type: string
          example: rev_c1d2e3f4a5b6
        taskId:
          type: string
          description: 关联任务号
          example: task_9f2e7c1a3b4d5e6f
        bizType:
          $ref: '#/components/schemas/VisionBizType'
        merchantId:
          type: string
          example: m_20260825001
        merchantName:
          type: string
          description: 商户名称（脱敏展示）
          example: 张*饭馆
        batchId:
          type: string
          example: b_20260801001
        imageKeys:
          type: array
          description: 图像对象键（预览用签名 URL 由前端另取）
          items:
            type: string
        status:
          $ref: '#/components/schemas/VisionReviewStatus'
        confidenceLevel:
          $ref: '#/components/schemas/ConfidenceLevel'
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          example: 0.93
        markersCount:
          type: integer
          format: int32
          example: 3
        createdAt:
          type: string
          format: date-time
          example: '2026-01-15T10:30:00Z'
        reviewedAt:
          type: string
          format: date-time
          description: 复核时间（已复核时有值）
          example: '2026-01-15T11:00:00Z'
    VisionReviewPage:
      allOf:
        - $ref: '../../_common/openapi.yaml#/components/schemas/PageResult'
        - type: object
          properties:
            list:
              type: array
              items:
                $ref: '#/components/schemas/VisionReviewItem'
    VisionMarker:
      type: object
      required: [label, level, confidence]
      properties:
        label:
          type: string
          description: 疑似问题标签（疑似过期/疑似变质/包装不规范/资质不符/未穿工装/卫生问题/明火离人等）
          example: 疑似过期
        level:
          $ref: '#/components/schemas/ConfidenceLevel'
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          example: 0.93
        bbox:
          type: object
          description: 图像内位置框（归一化坐标 0~1，用于前端框选展示）
          properties:
            x:
              type: number
              format: float
              minimum: 0
              maximum: 1
              example: 0.12
            y:
              type: number
              format: float
              minimum: 0
              maximum: 1
              example: 0.34
            width:
              type: number
              format: float
              minimum: 0
              maximum: 1
              example: 0.30
            height:
              type: number
              format: float
              minimum: 0
              maximum: 1
              example: 0.25
        suggestion:
          type: string
          description: 处置建议（仅建议，人工决策执行）
          example: 建议人工核对商品保质期并生成核查单
    VisionReviewDetail:
      allOf:
        - $ref: '#/components/schemas/VisionReviewItem'
        - type: object
          properties:
            markers:
              type: array
              description: 疑似问题标记列表
              items:
                $ref: '#/components/schemas/VisionMarker'
            audit:
              type: object
              description: 人工复核留痕（谁核、何时、结论，全链路审计）
              properties:
                verdict:
                  $ref: '#/components/schemas/VerdictAction'
                comment:
                  type: string
                  description: 复核意见
                  example: 已确认过期，生成核查单
                reviewedBy:
                  type: string
                  description: 复核人（脱敏展示）
                  example: 王*员
                reviewedAt:
                  type: string
                  format: date-time
                  example: '2026-01-15T11:00:00Z'
    VerdictAction:
      type: string
      description: 人工复核结论动作（C8：AI 不决策，人工确认后处置）
      enum: [CONFIRM, REFER, REJECT, ARCHIVE]
      example: CONFIRM
    VerdictRequest:
      type: object
      required: [action]
      properties:
        action:
          $ref: '#/components/schemas/VerdictAction'
        comment:
          type: string
          description: 复核意见（留痕，CONFIRM/REFER 建议必填）
          maxLength: 200
          example: 已确认包装违规，生成核查单
    VerdictResult:
      type: object
      required: [reviewId, status, reviewedBy, reviewedAt]
      properties:
        reviewId:
          type: string
          example: rev_c1d2e3f4a5b6
        status:
          $ref: '#/components/schemas/VisionReviewStatus'
        reviewedBy:
          type: string
          description: 复核人（脱敏展示）
          example: 王*员
        reviewedAt:
          type: string
          format: date-time
          example: '2026-01-15T11:00:00Z'
    VisionQaRequest:
      type: object
      required: [imageKey, question]
      properties:
        imageKey:
          type: string
          description: 图像 OSS 对象键（服务端脱敏后送视觉模型）
          example: qa/oss/2026/01/img001.jpg
        question:
          type: string
          description: 提问内容（如「这袋化肥包装合规吗」）
          maxLength: 200
          example: 这袋化肥包装合规吗
    VisionQaResult:
      type: object
      required: [answer, disclaimer]
      properties:
        answer:
          type: string
          description: 视觉模型辅助回答
          example: 从包装标识看，未见明显缺失项，建议以官方鉴定为准
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: 回答置信度（可选）
          example: 0.81
        disclaimer:
          type: string
          description: 合规声明（前端必须展示）：仅辅助判断，不作执法/鉴定结论
          example: 本回答仅作辅助判断，不作执法/鉴定结论，以监管或专业机构意见为准
    KitchenAnomalyStatus:
      type: string
      description: 后厨异常标记复核状态
      enum: [PENDING, CONFIRMED, REJECTED, ARCHIVED]
      example: PENDING
    KitchenAnomalyItem:
      type: object
      required: [anomalyId, streamId, anomalyType, status, detectedAt]
      properties:
        anomalyId:
          type: string
          example: kan_8f7e6d5c4b3a
        reviewId:
          type: string
          description: 复核记录号（复用视觉审核复核接口）
          example: rev_c1d2e3f4a5b6
        merchantId:
          type: string
          example: m_20260825001
        merchantName:
          type: string
          description: 商户名称（脱敏展示）
          example: 张*饭馆
        streamId:
          type: string
          description: 直播流标识（B-04 后厨直播）
          example: live_20260115_001
        anomalyType:
          type: string
          description: 异常类型（未穿工装/卫生问题/明火离人等）
          example: 未穿工装
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          example: 0.88
        confidenceLevel:
          $ref: '#/components/schemas/ConfidenceLevel'
        status:
          $ref: '#/components/schemas/KitchenAnomalyStatus'
        detectedAt:
          type: string
          format: date-time
          example: '2026-01-15T10:30:00Z'
        reviewedAt:
          type: string
          format: date-time
          example: '2026-01-15T11:00:00Z'
    KitchenAnomalyPage:
      allOf:
        - $ref: '../../_common/openapi.yaml#/components/schemas/PageResult'
        - type: object
          properties:
            list:
              type: array
              items:
                $ref: '#/components/schemas/KitchenAnomalyItem'
    KitchenAnomalyResult:
      type: object
      required: [anomalyId, reviewId, anomalyType, confidenceLevel]
      properties:
        anomalyId:
          type: string
          example: kan_8f7e6d5c4b3a
        reviewId:
          type: string
          description: 复核记录号（标记进复核流）
          example: rev_c1d2e3f4a5b6
        anomalyType:
          type: string
          example: 未穿工装
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          example: 0.88
        confidenceLevel:
          $ref: '#/components/schemas/ConfidenceLevel'
    RiskLevel:
      type: string
      description: 风险等级（平台自建模型输出，阈值上线前评审）
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
      example: HIGH
    RiskPredictRequest:
      type: object
      required: [merchantId]
      properties:
        merchantId:
          type: string
          description: 商户编号
          example: m_20260825001
    RiskPredictResult:
      type: object
      required: [merchantId, riskScore, riskLevel, factors, predictedAt]
      properties:
        merchantId:
          type: string
          example: m_20260825001
        riskScore:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: 风险分（0-100，越高风险越大）
          example: 82.5
        riskLevel:
          $ref: '#/components/schemas/RiskLevel'
        factors:
          type: array
          description: 风险因子（如欠薪风险：连续 2 期代付超时；假货风险：投诉激增）
          items:
            type: string
        suggestions:
          type: array
          description: 处置建议（AI 输出风险建议、人工决策执行）
          items:
            type: string
        predictedAt:
          type: string
          format: date-time
          example: '2026-01-15T10:30:00Z'
    RiskMerchant:
      allOf:
        - $ref: '#/components/schemas/RiskPredictResult'
        - type: object
          properties:
            merchantName:
              type: string
              description: 商户名称（脱敏展示）
              example: 张*饭馆
    RiskMerchantPage:
      allOf:
        - $ref: '../../_common/openapi.yaml#/components/schemas/PageResult'
        - type: object
          properties:
            list:
              type: array
              items:
                $ref: '#/components/schemas/RiskMerchant'

x-external-interfaces:
  description: |
    服务端间接口（内部调用），前端勿调，不在上方 paths 中。
    出方向（AICORE → 其他服务）：复核结论 CONFIRM 后异步回写 CRED（A-02 档案与信用分）、
    K-05 标记进复核流（复用本服务 verdict 接口）、风险预警事件上报 DASH（A-08 聚合）；
    云视觉/OCR 通道经 KMS 密钥、签数据合规协议（不用于训练、数据不出域）。
  endpoints:
    - method: POST
      path: /aicore/kitchen/anomalies
      tags: [kitchen]
      summary: 直播帧异常识别任务提交（服务端间，K-05）
      description: |
        直播流服务/TRACE 按抽帧策略提交画面帧（OSS 对象键）识别任务，需商户已授权（B-04）。
        服务端间鉴权（内部 Token）+ 幂等 + 限流。识别结果经统一任务队列回执（GET /aicore/tasks/{taskId}），
        标记进复核流后由监管端人工复核。前端永远不调用此接口。
      requestBody:
        description: 帧识别任务（服务端间报文）
        content:
          application/json:
            schema:
              type: object
              required: [streamId, merchantId, imageKey]
              properties:
                streamId:
                  type: string
                  description: 直播流标识
                merchantId:
                  type: string
                  description: 商户编号
                imageKey:
                  type: string
                  description: 画面帧 OSS 对象键
      responses:
        '200':
          description: 受理成功，返回任务号
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TaskAccepted'
    - method: POST
      path: /aicore/risk/scan
      tags: [risk]
      summary: 批量风险扫描触发（服务端间，K-06，M3）
      description: |
        DASH/JOB 定时触发批量风险商户扫描（平台自建模型、数据不出域），
        结果经事件上报 DASH 聚合为 A-08 预警，人工复核后推送。前端永远不调用此接口。
      requestBody:
        description: 批量扫描请求（服务端间报文）
        content:
          application/json:
            schema:
              type: object
              properties:
                riskLevels:
                  type: array
                  description: 扫描的风险等级范围（缺省全部）
                  items:
                    $ref: '#/components/schemas/RiskLevel'
                limit:
                  type: integer
                  format: int32
                  description: 单批最大商户数（缺省 1000）
                  example: 1000
      responses:
        '200':
          description: 受理成功（异步扫描）
          content:
            application/json:
              schema:
                $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
