openapi: 3.0.3
info:
  title: 画像服务 PROFILE · 接口文档
  version: 1.1.0
  description: |
    画像服务（PROFILE）前端接口文档。模块 J7 个人画像中心：J-07 画像构建与数据授权、J-08 画像管理页（四权）、
    J-09 个性化商品/服务推荐增强、J-10 个性化信息推荐、J-11 个性化使用引导；商铺画像与选择性监管【M2，§5.11.1.4】；
    **用户习惯与购买影响因素（长期记忆）【M1 起，2026-09-16 增】**。
    口径对齐：PDD v1.19 §5.11 / §6.4.11 / §4.4；需求口径 PRD §5.12（J 组 J7）、`28-个人画像与个性化推荐需求.md`；
    边界依据 SSOT v2.0 §2.11 / §3 / §4.16-C16。
    - 本文件 paths 仅含前端可调接口，可直接喂 packages/api-client 生成 TS 类型。
    - 服务端间接口（ASSIST 个性化推荐输出）见文末 x-external-interfaces 附录，前端勿调。
    - 公共组件（Envelope / PageResult / 错误码 / 分页 / 鉴权）引用 ../../_common/openapi.yaml，勿复制内联。
    - 红线（C7）：最小化收集；履历/行为/评论入画像需授权可撤回；四权齐全；**价格不因画像差异化（不杀熟）**；
      未成年人不建行为/购买画像（仅必要实名）；画像标签加密存储、脱敏输出、来源可查可解释；操作审计；
      删除后衍生数据 30 天内清理。商铺画像 = 特征集合，信用分 = CRED 派生的可公示评分，不另立第二套评分（C8）。
    - **习惯与购买影响因素（2026-09-16 定档）**：本服务为长期记忆类数据的**唯一权威存储**（`profile_habit` /
      `profile_habit_factor` / `behavior_daily_agg`）；权重计算由 AICORE **无状态提供**（`POST /aicore/habit/summarize`，
      只算不存）；**只存「权重 + 样本量 + 可解释证据」，不存人格推断标签**；权重**只进推荐排序、不进定价链路**；
      「不留跨会话记忆」（R-06）指**对话原文**，习惯结论属 J-07 画像类数据、不在 R-06 管辖范围内；**不引入 PostgreSQL**。
    - 里程碑：【M1 基础】画像构建/四权/授权管理/推荐基础/习惯与购买影响因素；【M2 完整】购买数据接入（`sampleSource=PURCHASE`）
      + 商铺画像与选择性监管。
servers:
  - url: https://api.example.com/api/v1
    description: 生产（示例域名）
  - url: http://localhost:8080/api/v1
    description: 本地开发（Java）
tags:
  - name: me
    description: 画像四权（J-07/J-08）
  - name: auth
    description: 数据源授权管理（J-07）
  - name: audit
    description: 操作审计（J-08）
  - name: feed
    description: 个性化信息与引导（J-10/J-11）
  - name: habit
    description: 用户习惯与购买影响因素（长期记忆，J-08 四权 / J-09 排序）
  - name: merchant
    description: 商铺画像（M2）

security:
  - bearerAuth: []

paths:
  /profile/me:
    get:
      tags: [me]
      summary: 查看画像（标签 + 来源 + 授权状态）【M1 · J-07/J-08】
      description: |
        画像管理页（四权之查看，线框 G-08）：维度标签（脱敏、加密存储、来源可查可解释）+
        数据来源与授权状态 + 个性化开关状态（authStatus）。
        未成年人不建行为/购买画像（仅必要实名）。未登录 → 2001。
      responses:
        '200':
          description: 成功，返回画像标签与来源
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProfileMeResult'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
    put:
      tags: [me]
      summary: 修改/主动完善画像【M1 · J-08】
      description: |
        四权之修改与主动完善（G-08）：纠错标签 + 主动完善（兴趣/职业/城市，自愿、可随时修改）；
        操作审计留痕（GET /profile/audit 可查）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: 成功，返回更新状态（留痕）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProfileUpdateResult'
        '400':
          $ref: '../../_common/openapi.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
    delete:
      tags: [me]
      summary: 删除画像（衍生数据 30 天清理）【M1 · J-08】
      description: |
        四权之一键删除（G-08，danger 二次确认）：画像衍生数据 30 天内清理、不影响基本功能；
        操作审计留痕。删除后个性化推荐自动回退通用规则。
      responses:
        '200':
          description: 成功，画像已删除（衍生数据 30 天内清理）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProfileDeleteResult'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
  /profile/me/opt-out:
    post:
      tags: [me]
      summary: 关闭个性化【M1 · J-08】
      description: |
        四权之关闭个性化（G-08）：关闭后推荐回退通用规则（J-03 规则排序）、停止行为画像采集；
        价格与画像无关（不杀熟，C7 不变）；可重新开启（PUT /profile/auth 或本接口幂等切换，见 PUT /profile/me）。
      responses:
        '200':
          description: 成功，个性化已关闭
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OptOutResult'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
  /profile/auth:
    put:
      tags: [auth]
      summary: 数据源授权管理（授权/撤回）【M1 · J-07】
      description: |
        履历/行为/评论入画像的授权管理（J-07，线框 G-08 画像管理（四权））：授权可撤回；
        撤回后停止该数据源采集并清理已入画像字段；未授权字段不入画像；
        实名信息（年龄/性别）按注册协议、购买数据（M2 起）按交易协议、不在此处切换。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthUpdateRequest'
      responses:
        '200':
          description: 成功，返回授权状态（留痕）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthUpdateResult'
        '400':
          $ref: '../../_common/openapi.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
  /profile/audit:
    get:
      tags: [audit]
      summary: 操作审计留痕查询【M1 · J-08】
      description: |
        画像操作审计留痕（J-08/G-08：查看/修改/授权/关闭/删除全审计）；仅本人可见，分页。
      parameters:
        - $ref: '../../_common/openapi.yaml#/components/parameters/Page'
        - $ref: '../../_common/openapi.yaml#/components/parameters/PageSize'
      responses:
        '200':
          description: 成功，返回审计记录（分页）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuditPage'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
  /profile/feeds:
    get:
      tags: [feed]
      summary: 个性化信息推荐【M1 基础 · J-10】
      description: |
        与己相关的信息推荐（J-10）：职业类（招工/培训/健康证提醒）、年龄类（养老/育儿/适龄服务）、
        行业类（监管新政/抽检结果）；受四权约束——关闭个性化后 personalized=false 且回退通用信息流、
        停止个性化推送；未成年人不建行为画像（推荐不受行为影响）。
      parameters:
        - $ref: '../../_common/openapi.yaml#/components/parameters/Page'
        - $ref: '../../_common/openapi.yaml#/components/parameters/PageSize'
      responses:
        '200':
          description: 成功，返回个性化信息流（关闭个性化时 personalized=false）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FeedResult'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
  /profile/guidance:
    get:
      tags: [feed]
      summary: 个性化使用引导【M1 基础 · J-11】
      description: |
        按角色与熟练度的使用引导（J-11）：新手按角色给步骤引导（复用 J-01 知识库，按画像排序）、
        熟手直达高频功能、异常行为主动提醒（如老板连续欠薪预警）；受画像四权约束；
        关闭个性化后 personalized=false 回退角色通用引导。
      responses:
        '200':
          description: 成功，返回使用引导
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GuidanceResult'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
  /profile/me/habits:
    get:
      tags: [habit]
      summary: 查看我的习惯与购买影响因素【M1 · J-08 四权之查看】
      description: |
        画像管理页「我的习惯」查看（四权之查看，2026-09-16 增）：返回习惯结论（六类 habitType：品类偏好/
        价格带/时段/频次/供应商信任/渠道）与购买影响因素权重（十类 factorCode）；**只存`权重 + 样本量 +
        可解释证据`，不返回人格推断标签**；来源可查可解释（evidence 为结构化证据摘要，不含对话原文）。
        关闭个性化（authStatus=DISABLED）→ 返回上次结论且 personalized=false，并停止重算；
        未成年人不建行为/购买画像 → 返回空列表。习惯属 J-07 画像类数据，不在 R-06 对话原文红线管辖范围内。
        仅本人可见，越权 → 2002；未登录 → 2001；本接口调用写入审计（action=VIEW）。
      responses:
        '200':
          description: 成功，返回习惯与影响因素（含样本来源与置信度）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/HabitResult'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../_common/openapi.yaml#/components/responses/Forbidden'
    delete:
      tags: [habit]
      summary: 清除我的习惯与购买影响因素【M1 · J-08 四权之删除】
      description: |
        四权之删除的习惯侧入口（danger 二次确认，2026-09-16 增）：清除习惯结论与影响因素权重
        （置 status=DELETED + cleanupDeadline=删除日+30 天，衍生数据 30 天内清理），不影响基本功能；
        清除后个性化推荐回退通用规则；操作写入审计（action=DELETE，detail=清除习惯与影响因素）。
        幂等：重复调用返回同结果（PURGED）。
      responses:
        '200':
          description: 成功，习惯与影响因素已清除（衍生数据 30 天内清理）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/HabitPurgeResult'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
  /profile/merchants/{merchantId}:
    get:
      tags: [merchant]
      summary: 商铺画像（五类特征，来源可查）【M2 占位】
      description: |
        商铺画像（PDD §5.11.1.4）：聚合商铺信息/购买者评价/卫生状况/信用/风险五类特征
        （聚合 A/B/K 既有数据，不新增采集），脱敏输出、来源可查可解释；
        供推荐排序（J-03/J-13 候选排序与放心供应商过滤）与监管端「画像风险 + 信用」分级监管（DASH 消费）；
        商铺画像 = 特征集合，信用分 = CRED 派生的可公示评分，**不另立第二套评分**；
        画像用于监管不替代人工执法（C8）。M2 占位，里程碑交付前口径以评审为准。
      parameters:
        - name: merchantId
          in: path
          required: true
          description: 商户编号
          schema:
            type: string
            example: m_20260825001
      responses:
        '200':
          description: 成功，返回商铺画像（特征 + 来源）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MerchantProfileResult'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
        '404':
          $ref: '../../_common/openapi.yaml#/components/responses/NotFound'

components:
  schemas:
    ProfileSourceType:
      type: string
      description: 画像数据源（六类：实名/履历/行为/评论/购买/主动完善）
      enum: [REALNAME, RESUME, BEHAVIOR, REVIEW, PURCHASE, MANUAL]
      example: RESUME
    ProfileSource:
      type: object
      required: [source, authorized]
      properties:
        source:
          $ref: '#/components/schemas/ProfileSourceType'
        authorized:
          type: boolean
          description: 授权状态（履历/行为/评论可撤回；实名按注册协议、购买按交易协议）
          example: true
        collectedAt:
          type: string
          format: date-time
          description: 最近采集时间
          example: '2026-09-01T10:00:00Z'
    ProfileTag:
      type: object
      required: [name, source]
      properties:
        name:
          type: string
          description: 标签维度（年龄段/职业/学历带/品类偏好/价格敏感度/行为活跃/评论倾向）
          example: 品类偏好
        value:
          type: string
          description: 标签值（脱敏展示）
          example: 农资/食材
        source:
          $ref: '#/components/schemas/ProfileSourceType'
    ProfileMeResult:
      type: object
      required: [tags, sources, authStatus, updatedAt]
      properties:
        tags:
          type: array
          description: 维度标签（加密存储、脱敏输出、来源可查）
          items:
            $ref: '#/components/schemas/ProfileTag'
        sources:
          type: array
          description: 数据来源与授权状态
          items:
            $ref: '#/components/schemas/ProfileSource'
        authStatus:
          type: string
          description: 个性化开关状态（关闭后推荐回退通用规则、停止行为采集与习惯重算）
          enum: [ENABLED, DISABLED]
          example: ENABLED
        habits:
          type: array
          description: 习惯与购买影响因素摘要（可选内嵌，2026-09-16 增；完整口径见 GET /profile/me/habits）
          items:
            $ref: '#/components/schemas/HabitSummary'
        updatedAt:
          type: string
          format: date-time
          example: '2026-09-01T10:00:00Z'
    ProfileUpdateRequest:
      type: object
      description: 主动完善（兴趣/职业/城市，自愿、可随时修改）
      properties:
        interests:
          type: array
          description: 兴趣/偏好自述
          items:
            type: string
            example: 有机食材
        occupation:
          type: string
          description: 职业自述
          maxLength: 50
          example: 餐饮经营者
        city:
          type: string
          description: 城市
          maxLength: 50
          example: 石家庄
    ProfileUpdateResult:
      type: object
      required: [status, updatedAt]
      properties:
        status:
          type: string
          enum: [UPDATED]
          example: UPDATED
        updatedAt:
          type: string
          format: date-time
          example: '2026-09-01T10:00:00Z'
    OptOutResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: 个性化状态（关闭后回退通用规则、停止行为采集）
          enum: [DISABLED]
          example: DISABLED
    ProfileDeleteResult:
      type: object
      required: [status, cleanupDays]
      properties:
        status:
          type: string
          enum: [DELETED]
          example: DELETED
        cleanupDays:
          type: integer
          format: int32
          description: 衍生数据清理期限（天）
          example: 30
    AuthUpdateRequest:
      type: object
      required: [source, authorized]
      properties:
        source:
          type: string
          description: 可切换授权的数据源（履历/行为/评论；实名与购买不在此处切换）
          enum: [RESUME, BEHAVIOR, REVIEW]
          example: BEHAVIOR
        authorized:
          type: boolean
          description: true 授权 / false 撤回（撤回后停止采集并清理已入画像字段）
          example: false
    AuthUpdateResult:
      type: object
      required: [source, authorized, updatedAt]
      properties:
        source:
          type: string
          enum: [RESUME, BEHAVIOR, REVIEW]
          example: BEHAVIOR
        authorized:
          type: boolean
          example: false
        updatedAt:
          type: string
          format: date-time
          example: '2026-09-01T10:00:00Z'
    AuditItem:
      type: object
      required: [auditId, action, at]
      properties:
        auditId:
          type: string
          description: 审计记录号
          example: aud_8f7e6d5c4b3a
        action:
          type: string
          description: 操作类型（查看/修改/授权/关闭/删除）
          enum: [VIEW, UPDATE, AUTH, OPT_OUT, DELETE]
          example: AUTH
        detail:
          type: string
          description: 操作明细（如 撤回行为数据授权）
          example: 撤回行为数据授权
        at:
          type: string
          format: date-time
          example: '2026-09-01T10:00:00Z'
    AuditPage:
      allOf:
        - $ref: '../../_common/openapi.yaml#/components/schemas/PageResult'
        - type: object
          properties:
            list:
              type: array
              items:
                $ref: '#/components/schemas/AuditItem'
    HabitType:
      type: string
      description: 习惯类型（六类，2026-09-16 定档）
      enum: [CATEGORY_PREF, PRICE_BAND, TIME_WINDOW, FREQUENCY, SUPPLIER_TRUST, CHANNEL]
      example: CATEGORY_PREF
    HabitFactorCode:
      type: string
      description: 购买影响因素码（十类，2026-09-16 定档；运营期可配置扩展）
      enum: [PRICE, CREDIT, TRACE, REVIEW, DELIVERY, BRAND, PROMO, SPEC, FRESHNESS, CERT]
      example: PRICE
    HabitSampleSource:
      type: string
      description: 样本来源（诚信标记）：M1 行为近似 / M2 交易 / 混合
      enum: [BEHAVIOR, PURCHASE, MIXED]
      example: BEHAVIOR
    HabitItem:
      type: object
      required: [habitId, habitType, topicKey, weight, confidence, sampleCount, sampleSource]
      properties:
        habitId:
          type: string
          description: 习惯号（hab_ 前缀，由 AICORE 无状态计算产出、本服务原样落库）
          example: hab_8f7e6d5c4b3a
        habitType:
          $ref: '#/components/schemas/HabitType'
        topicKey:
          type: string
          description: 习惯主题键（品类码/价格带码/时段码/供应商 ID/渠道码）
          example: CAT_FOOD_GRAIN
        topicLabel:
          type: string
          description: 主题可读名（脱敏展示，如 食材·粮油）
          example: 食材·粮油
        weight:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: 习惯权重 0~1（同 habitType 内归一化；仅用于推荐排序）
          example: 0.72
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: 置信度 0~1（样本不足示弱，推荐理由中弱化）
          example: 0.85
        sampleCount:
          type: integer
          format: int32
          description: 支撑样本量（决策事件条数）
          example: 37
        sampleSource:
          $ref: '#/components/schemas/HabitSampleSource'
        evidence:
          type: array
          description: 典型证据（可解释输出，不含对话原文）
          items:
            $ref: '#/components/schemas/HabitEvidence'
        lastSeenAt:
          type: string
          format: date-time
          description: 最近观测时间
          example: '2026-09-15T10:00:00Z'
    HabitFactor:
      type: object
      required: [factorId, factorCode, weight, confidence, sampleCount]
      properties:
        factorId:
          type: string
          description: 因素号（fac_ 前缀，由 AICORE 无状态计算产出、本服务原样落库）
          example: fac_3a2b1c0d9e8f
        factorCode:
          $ref: '#/components/schemas/HabitFactorCode'
        weight:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: 该因素在该用户决策中的影响权重 0~1（同账号内归一化；**只进排序、不进定价**）
          example: 0.42
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          example: 0.80
        sampleCount:
          type: integer
          format: int32
          description: 参与统计的决策次数
          example: 17
        evidence:
          type: array
          description: 典型对比证据（如「17 次采购中 11 次在同类中选择单价较低且溯源完整的选项」）
          items:
            $ref: '#/components/schemas/HabitEvidence'
        lastEvidenceAt:
          type: string
          format: date-time
          example: '2026-09-15T10:00:00Z'
    HabitEvidence:
      type: object
      required: [summary]
      properties:
        summary:
          type: string
          description: 证据可读说明（脱敏，仅描述行为与标的，不含对话原文与个人信息）
          example: 近 90 天内 11 次在同类中选择了溯源链完整的选项
        occurredAt:
          type: string
          format: date-time
          description: 证据发生时间
          example: '2026-09-10T09:30:00Z'
        subjectType:
          type: string
          description: 证据标的类型（品类/商品/供应商）
          enum: [CATEGORY, ITEM, SUPPLIER]
          example: CATEGORY
    HabitSummary:
      type: object
      description: 习惯摘要（内嵌于 GET /profile/me，完整内容见 GET /profile/me/habits）
      required: [habitType, topicLabel, weight]
      properties:
        habitType:
          $ref: '#/components/schemas/HabitType'
        topicLabel:
          type: string
          example: 食材·粮油
        weight:
          type: number
          format: float
          minimum: 0
          maximum: 1
          example: 0.72
    HabitResult:
      type: object
      required: [habits, factors, personalized, sampleSource, updatedAt]
      properties:
        habits:
          type: array
          description: 习惯结论（六类，重算覆盖式更新）
          items:
            $ref: '#/components/schemas/HabitItem'
        factors:
          type: array
          description: 购买影响因素权重（十类因素码）
          items:
            $ref: '#/components/schemas/HabitFactor'
        personalized:
          type: boolean
          description: 是否个性化（authStatus=DISABLED → false，保留上次结论、已停止重算）
          example: true
        sampleSource:
          $ref: '#/components/schemas/HabitSampleSource'
        updatedAt:
          type: string
          format: date-time
          description: 最近一次重算时间
          example: '2026-09-16T02:00:00Z'
    HabitPurgeResult:
      type: object
      required: [status, cleanupDays]
      properties:
        status:
          type: string
          description: 清除状态（幂等，重复调用返回同结果）
          enum: [PURGED]
          example: PURGED
        cleanupDays:
          type: integer
          format: int32
          description: 衍生数据清理期限（天）
          example: 30
    FeedType:
      type: string
      description: 信息推荐类型（J-10：职业类/年龄类/行业类）
      enum: [JOB, TRAINING, POLICY, SERVICE, AGE_CARE, INDUSTRY]
      example: TRAINING
    FeedItem:
      type: object
      required: [feedId, type, title]
      properties:
        feedId:
          type: string
          example: feed_8f7e6d5c4b3a
        type:
          $ref: '#/components/schemas/FeedType'
        title:
          type: string
          description: 信息标题
          example: 健康证到期提醒：您的健康证将于 30 天后到期
        summary:
          type: string
          description: 摘要
          example: 请及时办理换证
        publishedAt:
          type: string
          format: date-time
          example: '2026-09-01T08:00:00Z'
    FeedResult:
      type: object
      required: [list, total, page, pageSize, personalized]
      properties:
        list:
          type: array
          description: 信息流（当前页）
          items:
            $ref: '#/components/schemas/FeedItem'
        total:
          type: integer
          format: int64
          example: 25
        page:
          type: integer
          format: int32
          example: 1
        pageSize:
          type: integer
          format: int32
          example: 20
        personalized:
          type: boolean
          description: 是否个性化（关闭个性化 → false，回退通用信息流）
          example: true
    GuidanceItem:
      type: object
      required: [guidanceId, title, steps]
      properties:
        guidanceId:
          type: string
          example: gd_8f7e6d5c4b3a
        title:
          type: string
          description: 引导主题
          example: 新手开店三步走
        steps:
          type: array
          description: 步骤引导（复用 J-01 知识库，按画像排序）
          items:
            type: string
            example: 第一步：完成证照核验
        targetRoute:
          type: string
          description: 目标页面路由（可选）
          example: /manage/shop
    GuidanceResult:
      type: object
      required: [items, personalized]
      properties:
        items:
          type: array
          description: 使用引导列表（新手步骤引导/熟手高频直达/异常行为提醒）
          items:
            $ref: '#/components/schemas/GuidanceItem'
        personalized:
          type: boolean
          description: 是否个性化（关闭个性化 → false，回退角色通用引导）
          example: true
    MerchantFeature:
      type: object
      required: [dimension, value, source]
      properties:
        dimension:
          type: string
          description: 特征维度（商铺信息/购买者评价/卫生状况/信用/风险）
          example: 卫生状况
        value:
          type: string
          description: 特征值（脱敏展示）
          example: 抽检通过
        source:
          type: string
          description: 来源功能点（A-01/A-03/B-03/K-05/A-07/A-08，来源可查）
          example: B-03
    MerchantProfileResult:
      type: object
      required: [merchantId, features, updatedAt]
      properties:
        merchantId:
          type: string
          example: m_20260825001
        merchantName:
          type: string
          description: 商户名称（脱敏展示）
          example: 张*饭馆
        features:
          type: array
          description: 五类特征聚合（聚合 A/B/K 既有数据，不新增采集）
          items:
            $ref: '#/components/schemas/MerchantFeature'
        creditScore:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: 信用分（CRED 派生的可公示评分，不另立第二套评分）
          example: 90
        riskLevel:
          type: string
          description: 画像风险（供「画像风险+信用」分级监管，仅线索不自动执法）
          enum: [HIGH, MEDIUM, LOW]
          example: LOW
        updatedAt:
          type: string
          format: date-time
          example: '2026-09-01T10:00:00Z'

x-external-interfaces:
  description: |
    服务端间接口（内部调用），前端勿调，不在上方 paths 中。
    出方向依赖：
    - 数据源：ACC（实名）、CRED/EMP（履历/信用）、行为日志（浏览/搜索/会话，脱敏后入画像、不含对话原文）——行为日志经 MQ `profile.behavior` 消费入 `behavior_event` 表（无前端上报接口；存储/索引见 `services/profile/docs/er.md` §6.4/§7.4）；
      **TRADE（交易事实，M2 起，用于 `sampleSource=PURCHASE`）**；
    - **调用（无状态计算，2026-09-16 增）**：本服务向 **AICORE `POST /aicore/habit/summarize`** 发起习惯与购买影响因素计算——
      入参为 `behavior_daily_agg` 日聚合产物（**不含对话原文**），出参为习惯/因素结论信封，由本服务落
      `profile_habit` / `profile_habit_factor`；**AICORE 只算不存、不建记忆表**（边界基准 v2.0 §2.12/§4.16-C16）；
      服务端间鉴权（内部 Token）+ 幂等 + 限流；调用失败 → 保留上一版结论、不阻塞画像读写。接口 schema 以
      `services/aicore/docs/openapi.yaml` `x-external-interfaces` 为唯一可手改源；
    - 被依赖：ASSIST 调本服务获取授权画像**与习惯/影响因素权重**叠加推荐排序（J-09，叠加不替代、**价格与画像无关**）；
      DASH 商铺画像 → 分级监管（选择性监管，预警只推送线索不自动执法）；
    - 商铺申诉画像特征复用 A-07/D-03 机制（本服务不建第二套申诉）。
    - **技术选型口径**：本服务与习惯类数据**沿用 MySQL**（共享主库 + `profile_` schema 前缀隔离），**不引入 PostgreSQL**；
      短期会话记忆归 Redis（ASSIST，30 分钟 TTL），与长期习惯分属两条数据线（PDD v1.19 §4.4）。
  endpoints:
    - method: POST
      path: /profile/recommend
      tags: [me]
      summary: 个性化推荐输出（服务端间，ASSIST → PROFILE）
      description: |
        ASSIST 推荐场景调用（PDD §6.4.11 recommend，标「内部」）：基于授权画像**与习惯/购买影响因素权重**计算推荐权重
        （职业加权/价格敏感度/适龄过滤/习惯品类加权/因素权重叠加），叠加于 J-03 规则排序之上、叠加不替代；
        理由标注画像依据（**含习惯依据，可解释**）、价格与画像无关（不杀熟）；关闭个性化 → 返回通用规则结果。
        习惯权重来源为本服务 `profile_habit` / `profile_habit_factor`（长期记忆唯一权威存储，2026-09-16 增）；
        权重重算经 AICORE `POST /aicore/habit/summarize`（无状态）。
        服务端间鉴权（内部 Token）；越权账号访问 → 2002。前端永远不调用此接口。
      requestBody:
        description: 推荐请求（服务端间报文）
        content:
          application/json:
            schema:
              type: object
              required: [accountId]
              properties:
                accountId:
                  type: string
                  description: 用户账号
                context:
                  type: object
                  description: 推荐场景上下文（品类/关键词/预算等）
                  additionalProperties: true
      responses:
        '200':
          description: 成功，返回叠加画像权重的候选与理由
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [candidates, reasons]
                        properties:
                          candidates:
                            type: array
                            description: 候选（画像权重叠加后的排序）
                            items:
                              type: object
                              additionalProperties: true
                          reasons:
                            type: array
                            description: 画像依据说明（如「根据你的职业(餐饮)优先展示食材」）
                            items:
                              type: string
