# 网关服务 GATEWAY · 本地一键起(M1 初期形态:Redis + MySQL/MariaDB + ACC + 网关双实例)
# 用法:docker compose -f services/gateway/deploy/docker-compose.yml up -d
# 说明:生产部署用 K8s/裸机双实例 + Nginx upstream(见 nginx-gateway.conf.example);
#      本文件用于开发/测试环境一键验证「Nginx → 网关双实例 → ACC → DB/Redis」链路与降级行为。
#
# 2026-09-16 增量(双 token 会话,add-refresh-token-rotation 任务组 7):
#   ① 新增 **acc 服务**:会话凭据需要与网关共享同一个 Redis 实例(吊销名单 revoked:jti:{jti}
#      「ACC 写、网关读」),故 acc 明确 depends_on redis(healthy),并显式给出会话存储环境变量
#      `ACC_SESSION_STORE=redis` / `ACC_REDIS_HOST` / `ACC_REDIS_PORT` —— 生产**必须**取 redis,
#      取 memory 时进程内存储无法与网关共享吊销名单,登出/踢人静默失效(裁定 R-A8:switch 化 + 缺 host 启动失败);
#   ② 网关 GATEWAY_ACC_URI 默认指向容器内 acc 服务(而不是 host.docker.internal,避免"网关在容器、ACC 在宿主"的半容器错配);
#   ③ 新增 **mariadb 服务**:ACC 数据层需要一个真实库;首次启动自动执行 ACC 的 Flyway 迁移脚本
#      (services/acc/src/main/resources/db/migration/*.sql,建表 + 最小权限账号 acc_app)。
# 2026-09-16 增量二(最终评审修复波 FIX-1):
#   ④ Redis 淘汰策略改为 **noeviction**(原 allkeys-lru):会话族/refresh 映射/吊销名单都带 TTL,
#      volatile-* 一样会淘汰它们——吊销键 `revoked:jti:*` 被提前淘汰 = 登出后 token 又能用
#      (**静默 fail-open**),故本实例一律不淘汰会话键(见 services/gateway/deploy/README.md §1 前提表);
#   ⑤ acc 服务新增 `ACC_SESSION_ALLOWED_ORIGINS`:换发/仅凭 Cookie 登出的来源校验默认**同源放行**
#      (Origin 与请求自身 scheme+host 一致即可,裁定 R-A15),**只有跨源前端**才需要在此列出白名单。
# 2026-09-16 增量三(R-A16:网关保留原始 Host,I1 收口):
#   ⑥ acc 路由启用 SCG 的 **PreserveHostHeader** 过滤器(见 src/main/resources/application.yml):
#      SCG 默认把 Host 改写成下游内网地址,ACC 的「同源默认放行」需要浏览器看到的 host;
#      保留原始 Host 后默认链路(浏览器 → 入口 → 网关 → ACC)不再需要 X-Forwarded-* 或白名单
#      (HTTPS 入口仍需入口透传 X-Forwarded-Proto;X-Forwarded-Host 降级为备案/双保险)。
# 已知限制(详见 services/acc/deploy/Dockerfile 头注与 services/gateway/deploy/README.md §6):
#   ACC 的 M1 占位 DataSource 尚未替换为真实数据源 → 容器内触库路径不可用;
#   本 compose 先固化**部署拓扑与配置口径**(Redis 依赖/会话存储环境变量/同实例约束),
#   真机联调仍以 `services/acc/deploy/drill`(真实 ACC 进程 + 真实 MariaDB + 内嵌真实 Redis)为准。
version: "3.9"

services:
  redis:
    image: redis:7-alpine
    # 淘汰策略必须不淘汰会话键:revoked:jti:{jti} 被提前淘汰 = 登出/踢人静默 fail-open
    # (会话族/refresh/吊销键全部带 TTL,volatile-lru 同样会淘汰它们,故用 noeviction)
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-dev-root-only}
      MARIADB_DATABASE: acc
    ports:
      - "3306:3306"
    volumes:
      # ACC 的 Flyway 迁移脚本即建库脚本(顺序按文件名字典序,与 ACC 内 Flyway 一致)
      - ../../acc/src/main/resources/db/migration:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  acc:
    build:
      context: ../../..
      dockerfile: services/acc/deploy/Dockerfile
    image: msz/acc:0.1.0-SNAPSHOT
    depends_on:
      redis:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    environment:
      # 会话存储:必须与网关同一个 Redis 实例(否则吊销名单不共享 → 登出/踢人失效)
      ACC_SESSION_STORE: redis
      ACC_REDIS_HOST: redis
      ACC_REDIS_PORT: 6379
      # 换发/仅凭 Cookie 登出的来源校验:留空 = **同源放行**(Origin 与请求自身 scheme+host 一致即放行,
      # 裁定 R-A15);**默认链路已由 R-A16 闭合**——网关 acc 路由启用 PreserveHostHeader,入口按常规
      # `proxy_set_header Host $host` 透传原始 Host 即可(ACC 据此推断浏览器看到的 host),本项留空即可。
      # 仅当①前端与入口**跨源**(填前端入口 origin,逗号分隔)时需配置;HTTPS 入口(TLS 在入口终结)仍需入口
      # 透传 `X-Forwarded-Proto $scheme`,并建议同时透传 `X-Forwarded-Host $host` 作备案/双保险
      # (nginx-gateway.conf.example 两行均已给出;真机演练 3.10/3.11/3.12 已验证:只透传 Host 时同源 200、
      #  跨站 401 且不轮换)。
      ACC_SESSION_ALLOWED_ORIGINS: ${ACC_SESSION_ALLOWED_ORIGINS:-}
      # 短 token 有效期(秒):可配且**真正生效**,夹紧到 [60, 900];默认 900 = 网关上限
      ACC_SESSION_ACCESS_TOKEN_TTL_SECONDS: ${ACC_SESSION_ACCESS_TOKEN_TTL_SECONDS:-900}
      # 短 token/refresh 签名密钥:与网关同值,否则网关验签一律失败(生产经 KMS 注入)
      ACC_JWT_SECRET: ${ACC_JWT_SECRET:-dev-only-change-me}
      # 会话 Cookie 生产必须带 Secure(容器内为 http,仅本地联调试 true/false 需与入口 TLS 一致)
      ACC_SESSION_COOKIE_SECURE: ${ACC_SESSION_COOKIE_SECURE:-true}
      ACC_INTERNAL_TOKEN: ${ACC_INTERNAL_TOKEN:-dev-only-change-me}
      # 数据源(M1 占位 DataSource 尚未消费这些键,替换真实数据源后即为 ACC 的连接口径)
      ACC_DB_URL: jdbc:mariadb://mariadb:3306/acc
      ACC_DB_USERNAME: acc_app
      ACC_DB_PASSWORD: ${ACC_DB_PASSWORD:-dev-only-change-me}
    ports:
      - "8080:8080"

  gateway-a:
    build:
      context: ../../..
      dockerfile: services/gateway/deploy/Dockerfile
    image: msz/gateway:0.1.0-SNAPSHOT
    depends_on:
      redis:
        condition: service_healthy
    environment:
      GATEWAY_STORE: redis
      GATEWAY_REDIS_HOST: redis
      GATEWAY_JWT_SECRET: ${GATEWAY_JWT_SECRET:-dev-only-change-me}
      GATEWAY_ACC_URI: ${GATEWAY_ACC_URI:-http://acc:8080}
      GATEWAY_INSTANCE_ID: gateway-a
      GATEWAY_VERSION: 0.1.0-SNAPSHOT
    ports:
      - "8081:8081"

  gateway-b:
    image: msz/gateway:0.1.0-SNAPSHOT
    depends_on:
      redis:
        condition: service_healthy
    environment:
      GATEWAY_STORE: redis
      GATEWAY_REDIS_HOST: redis
      GATEWAY_JWT_SECRET: ${GATEWAY_JWT_SECRET:-dev-only-change-me}
      GATEWAY_ACC_URI: ${GATEWAY_ACC_URI:-http://acc:8080}
      GATEWAY_INSTANCE_ID: gateway-b
      GATEWAY_VERSION: 0.1.0-SNAPSHOT
    ports:
      - "8082:8081"

  # 可选:入口 Nginx(LB + TLS 终结 + /gateway/** 不对外暴露),配置见 nginx-gateway.conf.example
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - gateway-a
      - gateway-b
    volumes:
      - ./nginx-gateway.conf.example:/etc/nginx/conf.d/gateway.conf:ro
    ports:
      - "80:80"
