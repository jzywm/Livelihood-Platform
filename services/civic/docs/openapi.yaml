        reviewRate:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: 好评率（0-1）
          example: 0.95
        reviewCount:
          type: integer
          format: int32
          description: 点评数
          example: 128
        tags:
          type: array
          description: 标签（如 放心供应商/明厨亮灶）
          items:
            type: string
    ShopRecommendPage:
      allOf:
        - $ref: '../../_common/openapi.yaml#/components/schemas/PageResult'
        - type: object
          properties:
            list:
              type: array
              items:
                $ref: '#/components/schemas/ShopRecommendItem'
