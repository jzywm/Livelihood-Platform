openapi: 3.0.3
info:
  title: 民生互动服务 CIVIC · 接口文档
  version: 1.0.0
  description: |
    民生互动服务（CIVIC）前端接口文档。模块 G2 群众建议论坛（G-02）、H 民生建设监督（H-01/H-02）、
    E 社区生态（E-01 行业圈层论坛 / E-02 优质小店免费推广）、E-04 商户动态（PDD §5.14.6）。
    口径对齐：PDD §5.13 / §6.4.10 / §5.14.6；需求口径 PRD §5.6（E 组）、§5.8（G 组）、§5.9（H 组）；
    边界依据 SSOT §2.13。里程碑标注：【M2】群众建议论坛 / 商户动态；【M3】民生项目 / 圈层论坛 / 小店榜（占位）。
    - 本文件 paths 仅含前端可调接口，可直接喂 packages/api-client 生成 TS 类型。
    - 边界：G-01 热线诉求工单、G-03 部门限时办结归属 TICKET 工单服务，不在本服务。
    - 公共组件（Envelope / PageResult / 错误码 / 分页 / 鉴权）引用 ../../_common/openapi.yaml，勿复制内联。
    - 红线：小店榜非竞价、不收费（E-02 已确认口径）；R-03 匿名建议脱敏、公示数据脱敏；内容治理敏感词 + 人工复核；
      与画像边界——不收集无关信息、不用于画像训练。
servers:
  - url: https://api.example.com/api/v1
    description: 生产（示例域名）
  - url: http://localhost:8080/api/v1
    description: 本地开发（Java）
tags:
  - name: suggestion
    description: 群众建议论坛（G-02）
  - name: project
    description: 民生项目公开与监督（H-01/H-02）
  - name: forum
    description: 行业圈层论坛（E-01）
  - name: shop
    description: 优质小店免费推广（E-02）
  - name: post
    description: 商户动态（E-04）

security:
  - bearerAuth: []

paths:
  /civic/suggestion:
    post:
      tags: [suggestion]
      summary: 提交群众建议（实名/匿名可选）【M2 · G-02】
      description: |
        群众按分类发帖建议（G-02），实名或匿名可选。流程：提交 → 平台审核（敏感词 + 人工复核）→
        分派部门 → 限时答复（采纳/部分采纳/不采纳 + 理由）→ 采纳公示。
        匿名建议（anonymous=true）服务端脱敏处理（R-03），不收集无关信息、不用于画像训练；
        优秀建议者可获积分/荣誉（由平台侧运营授予，不在本接口）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestionRequest'
      responses:
        '200':
          description: 成功，返回建议号（进入平台审核）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SuggestionSubmitResult'
        '400':
          $ref: '../../_common/openapi.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
        '429':
          description: 触发限流（防刷）
          content:
            application/json:
              schema:
                $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
    get:
      tags: [suggestion]
      summary: 群众建议列表（含采纳公示）【M2 · G-02】
      description: |
        建议论坛列表：按分类/状态筛选，分页；公示数据脱敏（R-03）。
        状态含义：PENDING_REVIEW 待审核 → ASSIGNED 已分派部门 → ADOPTED/PARTIALLY_ADOPTED/REJECTED 已答复（采纳公示）。
      parameters:
        - $ref: '../../_common/openapi.yaml#/components/parameters/Page'
        - $ref: '../../_common/openapi.yaml#/components/parameters/PageSize'
        - name: category
          in: query
          required: false
          description: 建议分类筛选
          schema:
            type: string
            maxLength: 50
        - name: status
          in: query
          required: false
          description: 状态筛选
          schema:
            $ref: '#/components/schemas/SuggestionStatus'
        - name: keyword
          in: query
          required: false
          description: 标题关键词搜索
          schema:
            type: string
            maxLength: 50
      responses:
        '200':
          description: 成功，返回建议列表（分页）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SuggestionPage'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
  /civic/suggestions/{suggestionId}:
    get:
      tags: [suggestion]
      summary: 建议详情（含答复与采纳公示）【M2 · G-02】
      description: |
        建议详情：正文、附件、审核状态、部门答复（采纳/部分采纳/不采纳 + 理由）公示（脱敏，R-03）。
      parameters:
        - name: suggestionId
          in: path
          required: true
          description: 建议号
          schema:
            type: string
            example: sug_8f7e6d5c4b3a
      responses:
        '200':
          description: 成功，返回建议详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SuggestionDetail'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
        '404':
          $ref: '../../_common/openapi.yaml#/components/responses/NotFound'
  /civic/suggestions/{suggestionId}/reply:
    post:
      tags: [suggestion]
      summary: 部门限时答复（采纳/部分采纳/不采纳 + 理由）【M2 · G-02】
      description: |
        监管部门对已分派建议作出限时答复（G-02：采纳/部分采纳/不采纳 + 理由），答复结果公示（脱敏）。
        需监管角色（RBAC）；重复答复（已答复状态）报 3007；答复留痕可审计。
      parameters:
        - name: suggestionId
          in: path
          required: true
          description: 建议号
          schema:
            type: string
            example: sug_8f7e6d5c4b3a
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestionReplyRequest'
      responses:
        '200':
          description: 成功，返回答复结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SuggestionReplyResult'
        '400':
          $ref: '../../_common/openapi.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../_common/openapi.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../../_common/openapi.yaml#/components/responses/NotFound'
        '422':
          description: 状态不允许（code=3007，建议已答复，不可重复答复）
          content:
            application/json:
              schema:
                $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
              example:
                code: 3007
                message: 状态不允许该操作
                data: null
                traceId: 3f2a1b9c8d7e6f50
                timestamp: '2026-01-15T10:30:00Z'
  /civic/suggestions/{suggestionId}/dispatch:
    post:
      tags: [suggestion]
      summary: 平台审核通过后分派部门【M2 · G-02】
      description: |
        平台对审核通过的建议分派责任部门（G-02 流程：提交 → 平台审核 → 分派部门 → 限时答复 → 采纳公示；
        2026-09-11 补齐端点）。需平台运营/监管角色（2002）；非 PENDING_REVIEW 状态 → 3007；分派留痕可审计。
      parameters:
        - name: suggestionId
          in: path
          required: true
          description: 建议号
          schema:
            type: string
            example: sug_8f7e6d5c4b3a
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestionDispatchRequest'
      responses:
        '200':
          description: 成功，返回分派结果（进入 ASSIGNED 待答复）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SuggestionDispatchResult'
        '400':
          $ref: '../../_common/openapi.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../_common/openapi.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../../_common/openapi.yaml#/components/responses/NotFound'
        '422':
          description: 状态不允许（code=3007，非 PENDING_REVIEW）
          content:
            application/json:
              schema:
                $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
              example:
                code: 3007
                message: 状态不允许该操作
                data: null
                traceId: 3f2a1b9c8d7e6f50
                timestamp: '2026-01-15T10:30:00Z'
  /civic/projects:
    post:
      tags: [project]
      summary: 民生项目发布【M3 · H-01 占位】
      description: |
        政府/监管部门发布民生项目（H-01：计划/资金/工期/责任部门）并公开；项目进度经
        PUT /civic/projects/{projectId}/progress 实时同步；需监管/运营角色（2002）。M3 占位（2026-09-11 补）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectPublishRequest'
      responses:
        '200':
          description: 成功，项目发布进入公开列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProjectSubmitResult'
        '400':
          $ref: '../../_common/openapi.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../_common/openapi.yaml#/components/responses/Forbidden'
    get:
      tags: [project]
      summary: 民生项目列表【M3 · H-01 占位】
      description: |
        民生项目公开列表（H-01）：计划/资金/工期/责任部门公开，进度实时同步（图文/视频/数据）。
        按状态筛选、分页；公示数据脱敏（R-03）。本接口为 M3 占位（里程碑交付前口径以评审为准）。
      parameters:
        - $ref: '../../_common/openapi.yaml#/components/parameters/Page'
        - $ref: '../../_common/openapi.yaml#/components/parameters/PageSize'
        - name: status
          in: query
          required: false
          description: 项目状态筛选
          schema:
            $ref: '#/components/schemas/ProjectStatus'
        - name: keyword
          in: query
          required: false
          description: 项目名称关键词搜索
          schema:
            type: string
            maxLength: 50
      responses:
        '200':
          description: 成功，返回项目列表（分页）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProjectPage'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
  /civic/projects/{projectId}:
    get:
      tags: [project]
      summary: 民生项目详情与进度【M3 · H-01 占位】
      description: |
        项目详情：计划/资金/工期/责任部门 + 进度同步（进度节点图文/视频/数据）。M3 占位。
      parameters:
        - name: projectId
          in: path
          required: true
          description: 项目编号
          schema:
            type: string
            example: prj_20260115001
      responses:
        '200':
          description: 成功，返回项目详情与进度
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProjectDetail'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
        '404':
          $ref: '../../_common/openapi.yaml#/components/responses/NotFound'
  /civic/projects/{projectId}/progress:
    put:
      tags: [project]
      summary: 民生项目进度同步【M3 · H-01 占位】
      description: |
        责任部门同步项目进度（H-01：图文/视频/数据），群众实时查看；需责任部门/监管角色（2002）。M3 占位（2026-09-11 补）。
      parameters:
        - name: projectId
          in: path
          required: true
          description: 项目编号
          schema:
            type: string
            example: prj_20260115001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectProgressRequest'
      responses:
        '200':
          description: 成功，进度节点已同步
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProjectProgressResult'
        '400':
          $ref: '../../_common/openapi.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../_common/openapi.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../../_common/openapi.yaml#/components/responses/NotFound'
  /civic/projects/{projectId}/comment:
    post:
      tags: [project]
      summary: 群众对项目提意见【M3 · H-02 占位】
      description: |
        群众对民生项目提意见（H-02），可附证据；建设方限时回应并公示。M3 占位。
      parameters:
        - name: projectId
          in: path
          required: true
          description: 项目编号
          schema:
            type: string
            example: prj_20260115001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCommentRequest'
      responses:
        '200':
          description: 成功，返回意见号
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProjectCommentSubmitResult'
        '400':
          $ref: '../../_common/openapi.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
        '404':
          $ref: '../../_common/openapi.yaml#/components/responses/NotFound'
  /civic/projects/{projectId}/comments:
    get:
      tags: [project]
      summary: 项目意见列表（含建设方回应公示）【M3 · H-02 占位】
      description: |
        群众意见列表：建设方限时回应记录公示（脱敏，R-03）。M3 占位。
      parameters:
        - name: projectId
          in: path
          required: true
          description: 项目编号
          schema:
            type: string
            example: prj_20260115001
        - $ref: '../../_common/openapi.yaml#/components/parameters/Page'
        - $ref: '../../_common/openapi.yaml#/components/parameters/PageSize'
      responses:
        '200':
          description: 成功，返回意见列表（分页，含回应公示）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProjectCommentPage'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
        '404':
          $ref: '../../_common/openapi.yaml#/components/responses/NotFound'
  /civic/projects/{projectId}/comments/{commentId}/reply:
    post:
      tags: [project]
      summary: 建设方限时回应【M3 · H-02 占位】
      description: |
        建设方对群众意见限时回应（H-02），回应记录公示；需建设方/监管角色（RBAC）。M3 占位。
      parameters:
        - name: projectId
          in: path
          required: true
          description: 项目编号
          schema:
            type: string
            example: prj_20260115001
        - name: commentId
          in: path
          required: true
          description: 意见号
          schema:
            type: string
            example: cmt_1a2b3c4d5e6f
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCommentReplyRequest'
      responses:
        '200':
          description: 成功，返回回应结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProjectCommentReplyResult'
        '400':
          $ref: '../../_common/openapi.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../_common/openapi.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../../_common/openapi.yaml#/components/responses/NotFound'
        '422':
          description: 状态不允许（code=3007，已回应不可重复回应）
          content:
            application/json:
              schema:
                $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
              example:
                code: 3007
                message: 状态不允许该操作
                data: null
                traceId: 3f2a1b9c8d7e6f50
                timestamp: '2026-01-15T10:30:00Z'
  /civic/forum/post:
    post:
      tags: [forum]
      summary: 行业圈层论坛发帖【M3 · E-01 占位】
      description: |
        按行业/地域分层论坛发帖（E-01）：内容治理敏感词 + 人工复核，防谣言；
        违规内容（敏感词）拦截 → 3011；未成年人不当内容 → 3010；发帖内容不用于画像训练。M3 占位。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForumPostRequest'
      responses:
        '200':
          description: 成功，返回帖子号（内容审核通过后展示）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ForumPostSubmitResult'
        '400':
          $ref: '../../_common/openapi.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
        '422':
          description: 内容违规/未成年人内容限制（code=3011 敏感词 + 人工复核拦截 / code=3010 未成年人不当内容）
          content:
            application/json:
              schema:
                $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
              example:
                code: 3011
                message: 内容违规，已拦截
                data: null
                traceId: 3f2a1b9c8d7e6f50
                timestamp: '2026-01-15T10:30:00Z'
  /civic/forum/posts:
    get:
      tags: [forum]
      summary: 论坛帖子列表【M3 · E-01 占位】
      description: |
        按行业/地域圈层浏览帖子（E-01），分页；圈层分类体系上线前评审（circle 为圈层标识）。
        M3 占位。
      parameters:
        - $ref: '../../_common/openapi.yaml#/components/parameters/Page'
        - $ref: '../../_common/openapi.yaml#/components/parameters/PageSize'
        - name: circle
          in: query
          required: false
          description: 圈层标识（行业/地域分层，如 餐饮/家政/桥西区）
          schema:
            type: string
            maxLength: 50
        - name: keyword
          in: query
          required: false
          description: 标题关键词搜索
          schema:
            type: string
            maxLength: 50
      responses:
        '200':
          description: 成功，返回帖子列表（分页）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ForumPostPage'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
  /civic/forum/posts/{postId}:
    get:
      tags: [forum]
      summary: 帖子详情（含回复）【M3 · E-01 占位】
      description: |
        帖子详情与回复列表（E-01）；作者昵称脱敏展示（R-03）。M3 占位。
      parameters:
        - name: postId
          in: path
          required: true
          description: 帖子号
          schema:
            type: string
            example: fpost_1a2b3c4d5e6f
      responses:
        '200':
          description: 成功，返回帖子详情与回复
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ForumPostDetail'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
        '404':
          $ref: '../../_common/openapi.yaml#/components/responses/NotFound'
  /civic/forum/posts/{postId}/reply:
    post:
      tags: [forum]
      summary: 回帖【M3 · E-01 占位】
      description: |
        回复帖子（E-01）：内容治理敏感词 + 人工复核；违规拦截 → 3011（未成年人不当内容 3010）。M3 占位。
      parameters:
        - name: postId
          in: path
          required: true
          description: 帖子号
          schema:
            type: string
            example: fpost_1a2b3c4d5e6f
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForumReplyRequest'
      responses:
        '200':
          description: 成功，返回回复号
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ForumReplyResult'
        '400':
          $ref: '../../_common/openapi.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
        '404':
          $ref: '../../_common/openapi.yaml#/components/responses/NotFound'
        '422':
          description: 内容违规/未成年人内容限制（code=3011 / code=3010）
          content:
            application/json:
              schema:
                $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
              example:
                code: 3011
                message: 内容违规，已拦截
                data: null
                traceId: 3f2a1b9c8d7e6f50
                timestamp: '2026-01-15T10:30:00Z'
  /civic/shops/recommended:
    get:
      tags: [shop]
      summary: 优质小店免费推广榜（信用加权，非竞价）【M3 · E-02 占位】
      description: |
        优质小店免费上榜（E-02）：群众点评 + 信用加权推荐，**非竞价、不收费**（E-02 已确认口径）；
        防刷拦截（R-15）；上榜 = 信用换流量，形成「信用 → 流量 → 守法」正循环。M3 占位。
      parameters:
        - $ref: '../../_common/openapi.yaml#/components/parameters/Page'
        - $ref: '../../_common/openapi.yaml#/components/parameters/PageSize'
        - name: industry
          in: query
          required: false
          description: 行业筛选（如 餐饮/家政/维修）
          schema:
            type: string
            maxLength: 50
      responses:
        '200':
          description: 成功，返回小店榜（分页）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ShopRecommendPage'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
  /civic/shops/{merchantId}/reviews:
    post:
      tags: [shop]
      summary: 群众点评小店【M3 · E-02 占位】
      description: |
        消费者对优质小店实名点评（E-02）：评分 + 内容；信用加权推荐与榜单排序的输入之一；
        防刷拦截（R-15）+ 限流（429）；恶意点评可走 D-03 申诉（TICKET）。M3 占位。
      parameters:
        - name: merchantId
          in: path
          required: true
          description: 商户编号
          schema:
            type: string
            example: m_20260825001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShopReviewRequest'
      responses:
        '200':
          description: 成功，返回点评号
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ShopReviewResult'
        '400':
          $ref: '../../_common/openapi.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
        '404':
          $ref: '../../_common/openapi.yaml#/components/responses/NotFound'
        '429':
          description: 触发限流（防刷，R-15）
          content:
            application/json:
              schema:
                $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
  /civic/posts:
    post:
      tags: [post]
      summary: 商户动态发布（图文/短视频）【M2 · E-04】
      description: |
        商户发布图文/短视频动态（E-04：上新/优惠/营业状态/实拍）。流程：编辑动态 → 内容审核
        （敏感词 + 人工复核）→ 审核通过展示在店铺主页/首页动态流。
        merchantId 必须为本人商户（水平越权校验，2002）；违规内容拦截 → 3011；
        非竞价排序（时间/信用），不做付费置顶；恶意刷动态 → 防刷拦截（429）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantPostRequest'
      responses:
        '200':
          description: 成功，返回动态号（内容审核通过后展示）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MerchantPostSubmitResult'
        '400':
          $ref: '../../_common/openapi.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../_common/openapi.yaml#/components/responses/Forbidden'
        '422':
          description: 内容违规/未成年人内容限制（code=3011 敏感词 + 人工复核拦截 / code=3010 未成年人不当内容）
          content:
            application/json:
              schema:
                $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
              example:
                code: 3011
                message: 内容违规，已拦截
                data: null
                traceId: 3f2a1b9c8d7e6f50
                timestamp: '2026-01-15T10:30:00Z'
        '429':
          description: 触发限流（防刷，R-15）
          content:
            application/json:
              schema:
                $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
    get:
      tags: [post]
      summary: 商户动态流列表（店铺主页/首页）【M2 · E-04】
      description: |
        动态流列表（E-04）：merchantId 传参 = 店铺主页动态；不传 = 首页动态流（非竞价排序：时间/信用，
        无付费置顶）；分页。审核未通过/被拒动态不展示。
      parameters:
        - $ref: '../../_common/openapi.yaml#/components/parameters/Page'
        - $ref: '../../_common/openapi.yaml#/components/parameters/PageSize'
        - name: merchantId
          in: query
          required: false
          description: 商户编号（传参 = 店铺主页动态流；不传 = 首页动态流）
          schema:
            type: string
            example: m_20260825001
      responses:
        '200':
          description: 成功，返回动态流（分页）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MerchantPostPage'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'

components:
  schemas:
    SuggestionRequest:
      type: object
      required: [category, title, content]
      properties:
        category:
          type: string
          description: 建议分类（论坛分类体系上线前评审）
          maxLength: 50
          example: 市场监管
        title:
          type: string
          description: 建议标题
          maxLength: 100
          example: 建议菜市场增设公平秤
        content:
          type: string
          description: 建议内容（敏感词 + 人工复核）
          maxLength: 5000
          example: 希望 XX 菜市场每个摊位都配公平秤……
        anonymous:
          type: boolean
          description: 匿名提交（服务端脱敏，不收集无关信息、不用于画像训练）
          default: false
        evidenceKeys:
          type: array
          description: 附件（OSS 对象键，前端直传后回传）
          items:
            type: string
    SuggestionSubmitResult:
      type: object
      required: [suggestionId, status]
      properties:
        suggestionId:
          type: string
          description: 建议号
          example: sug_8f7e6d5c4b3a
        status:
          $ref: '#/components/schemas/SuggestionStatus'
    SuggestionStatus:
      type: string
      description: 建议状态（提交 → 平台审核分派 → 限时答复 → 采纳公示）
      enum: [PENDING_REVIEW, ASSIGNED, ADOPTED, PARTIALLY_ADOPTED, REJECTED]
      example: ASSIGNED
    SuggestionItem:
      type: object
      required: [suggestionId, category, title, status, createdAt]
      properties:
        suggestionId:
          type: string
          example: sug_8f7e6d5c4b3a
        category:
          type: string
          example: 市场监管
        title:
          type: string
          example: 建议菜市场增设公平秤
        anonymous:
          type: boolean
          description: 是否匿名（匿名建议展示脱敏）
          example: true
        status:
          $ref: '#/components/schemas/SuggestionStatus'
        createdAt:
          type: string
          format: date-time
          example: '2026-01-15T10:30:00Z'
        repliedAt:
          type: string
          format: date-time
          description: 答复时间（已答复时有值）
          example: '2026-01-22T09:00:00Z'
    SuggestionPage:
      allOf:
        - $ref: '../../_common/openapi.yaml#/components/schemas/PageResult'
        - type: object
          properties:
            list:
              type: array
              items:
                $ref: '#/components/schemas/SuggestionItem'
    SuggestionReply:
      type: object
      required: [verdict, repliedAt]
      properties:
        verdict:
          type: string
          description: 答复结论（采纳/部分采纳/不采纳 + 理由）
          enum: [ADOPTED, PARTIALLY_ADOPTED, REJECTED]
          example: ADOPTED
        reason:
          type: string
          description: 答复理由（公示，脱敏）
          example: 已协调市场方于本月增设公平秤
        department:
          type: string
          description: 答复部门
          example: 市场监管局
        repliedAt:
          type: string
          format: date-time
          example: '2026-01-22T09:00:00Z'
    SuggestionDetail:
      allOf:
        - $ref: '#/components/schemas/SuggestionItem'
        - type: object
          properties:
            content:
              type: string
              description: 建议正文
              example: 希望 XX 菜市场每个摊位都配公平秤……
            evidenceKeys:
              type: array
              description: 附件对象键
              items:
                type: string
            reply:
              $ref: '#/components/schemas/SuggestionReply'
    SuggestionReplyRequest:
      type: object
      required: [verdict]
      properties:
        verdict:
          type: string
          description: 答复结论（采纳/部分采纳/不采纳）
          enum: [ADOPTED, PARTIALLY_ADOPTED, REJECTED]
          example: ADOPTED
        reason:
          type: string
          description: 答复理由（公示，脱敏；不采纳必填）
          maxLength: 2000
          example: 已协调市场方于本月增设公平秤
    SuggestionReplyResult:
      type: object
      required: [suggestionId, verdict, repliedAt]
      properties:
        suggestionId:
          type: string
          example: sug_8f7e6d5c4b3a
        verdict:
          type: string
          enum: [ADOPTED, PARTIALLY_ADOPTED, REJECTED]
          example: ADOPTED
        repliedAt:
          type: string
          format: date-time
          example: '2026-01-22T09:00:00Z'
    SuggestionDispatchRequest:
      type: object
      required: [department]
      properties:
        department:
          type: string
          description: 分派责任部门（答复部门）
          maxLength: 50
          example: 市场监管局
        note:
          type: string
          description: 分派备注（可选，留痕）
          maxLength: 500
          example: 涉及集贸市场公平秤，转市监局办理
    SuggestionDispatchResult:
      type: object
      required: [suggestionId, status, department]
      properties:
        suggestionId:
          type: string
          example: sug_8f7e6d5c4b3a
        status:
          type: string
          description: 分派后状态（ASSIGNED 待部门答复）
          enum: [ASSIGNED]
          example: ASSIGNED
        department:
          type: string
          example: 市场监管局
    ProjectStatus:
      type: string
      description: 民生项目状态
      enum: [PLANNED, ONGOING, PAUSED, COMPLETED]
      example: ONGOING
    ProjectItem:
      type: object
      required: [projectId, title, status, progress, updatedAt]
      properties:
        projectId:
          type: string
          example: prj_20260115001
        title:
          type: string
          description: 项目名称
          example: 城北社区口袋公园建设
        status:
          $ref: '#/components/schemas/ProjectStatus'
        department:
          type: string
          description: 责任部门
          example: 区住建局
        budget:
          type: number
          description: 资金（万元）
          example: 320
        startDate:
          type: string
          format: date
          example: '2026-03-01'
        endDate:
          type: string
          format: date
          example: '2026-12-31'
        progress:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: 进度百分比
          example: 45
        updatedAt:
          type: string
          format: date-time
          description: 进度最近更新时间
          example: '2026-01-15T10:30:00Z'
    ProjectPage:
      allOf:
        - $ref: '../../_common/openapi.yaml#/components/schemas/PageResult'
        - type: object
          properties:
            list:
              type: array
              items:
                $ref: '#/components/schemas/ProjectItem'
    ProgressNote:
      type: object
      required: [at, text]
      properties:
        at:
          type: string
          format: date-time
          description: 进度更新时间
          example: '2026-01-15T10:30:00Z'
        text:
          type: string
          description: 进度说明
          example: 完成场地平整与管线铺设
        mediaKeys:
          type: array
          description: 进度图文/视频（OSS 对象键）
          items:
            type: string
    ProjectDetail:
      allOf:
        - $ref: '#/components/schemas/ProjectItem'
        - type: object
          properties:
            plan:
              type: string
              description: 建设计划说明
              example: 分三期建设：场地平整 → 绿化景观 → 设施安装
            notes:
              type: array
              description: 进度同步记录（图文/视频/数据）
              items:
                $ref: '#/components/schemas/ProgressNote'
    ProjectPublishRequest:
      type: object
      required: [name, dept, budget]
      properties:
        name:
          type: string
          description: 项目名称
          maxLength: 100
          example: 裕华区口袋公园二期
        dept:
          type: string
          description: 责任部门
          maxLength: 50
          example: 区住建局
        budget:
          type: string
          description: 预算（万元，字符串小数）
          example: '1200.00'
        periodFrom:
          type: string
          format: date
          description: 工期起
          example: '2026-04-01'
        periodTo:
          type: string
          format: date
          description: 工期止
          example: '2026-12-31'
        plan:
          type: string
          description: 建设计划说明
          maxLength: 2000
          example: 分三期建设：场地平整 → 绿化景观 → 设施安装
    ProjectSubmitResult:
      type: object
      required: [projectId, status]
      properties:
        projectId:
          type: string
          description: 项目编号
          example: prj_20260115001
        status:
          $ref: '#/components/schemas/ProjectStatus'
    ProjectProgressRequest:
      type: object
      required: [progress]
      properties:
        progress:
          type: string
          description: 进度说明（图文/视频/数据，敏感词 + 人工复核）
          maxLength: 2000
          example: 一期场地平整已完成 80%，预计下月进入绿化阶段
        mediaKeys:
          type: array
          description: 图文/视频附件（OSS 对象键）
          items:
            type: string
    ProjectProgressResult:
      type: object
      required: [projectId, updatedAt]
      properties:
        projectId:
          type: string
          example: prj_20260115001
        updatedAt:
          type: string
          format: date-time
          example: '2026-05-15T10:00:00Z'
    ProjectCommentRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: 意见内容（敏感词 + 人工复核）
          maxLength: 2000
          example: 希望公园增加儿童活动区
        evidenceKeys:
          type: array
          description: 证据附件（OSS 对象键，可选）
          items:
            type: string
    ProjectCommentSubmitResult:
      type: object
      required: [commentId]
      properties:
        commentId:
          type: string
          description: 意见号
          example: cmt_1a2b3c4d5e6f
    ProjectCommentReply:
      type: object
      required: [content, repliedAt]
      properties:
        content:
          type: string
          description: 回应内容（公示，脱敏）
          example: 已收到意见，儿童活动区已纳入二期设计
        department:
          type: string
          description: 回应方（建设方/责任部门）
          example: 区住建局
        repliedAt:
          type: string
          format: date-time
          example: '2026-01-20T09:00:00Z'
    ProjectCommentItem:
      type: object
      required: [commentId, projectId, content, createdAt]
      properties:
        commentId:
          type: string
          example: cmt_1a2b3c4d5e6f
        projectId:
          type: string
          example: prj_20260115001
        content:
          type: string
          example: 希望公园增加儿童活动区
        evidenceKeys:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
          example: '2026-01-15T10:30:00Z'
        reply:
          $ref: '#/components/schemas/ProjectCommentReply'
    ProjectCommentPage:
      allOf:
        - $ref: '../../_common/openapi.yaml#/components/schemas/PageResult'
        - type: object
          properties:
            list:
              type: array
              items:
                $ref: '#/components/schemas/ProjectCommentItem'
    ProjectCommentReplyRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: 回应内容（限时回应，公示脱敏）
          maxLength: 2000
          example: 已收到意见，儿童活动区已纳入二期设计
    ProjectCommentReplyResult:
      type: object
      required: [commentId, repliedAt]
      properties:
        commentId:
          type: string
          example: cmt_1a2b3c4d5e6f
        repliedAt:
          type: string
          format: date-time
          example: '2026-01-20T09:00:00Z'
    ForumPostRequest:
      type: object
      required: [circle, title, content]
      properties:
        circle:
          type: string
          description: 圈层标识（行业/地域分层，如 餐饮/家政/桥西区）
          maxLength: 50
          example: 餐饮
        title:
          type: string
          description: 帖子标题
          maxLength: 100
          example: 餐饮同行交流：后厨卫生自查经验
        content:
          type: string
          description: 帖子内容（敏感词 + 人工复核）
          maxLength: 10000
          example: 分享一套自查清单……
        imageKeys:
          type: array
          description: 图片附件（OSS 对象键）
          items:
            type: string
    ForumPostSubmitResult:
      type: object
      required: [postId]
      properties:
        postId:
          type: string
          description: 帖子号（审核通过后展示）
          example: fpost_1a2b3c4d5e6f
    ForumPostItem:
      type: object
      required: [postId, circle, title, createdAt]
      properties:
        postId:
          type: string
          example: fpost_1a2b3c4d5e6f
        circle:
          type: string
          example: 餐饮
        title:
          type: string
          example: 餐饮同行交流：后厨卫生自查经验
        authorName:
          type: string
          description: 作者昵称（脱敏展示，R-03）
          example: 张*饭馆
        replyCount:
          type: integer
          format: int32
          description: 回复数
          example: 3
        createdAt:
          type: string
          format: date-time
          example: '2026-01-15T10:30:00Z'
    ForumPostPage:
      allOf:
        - $ref: '../../_common/openapi.yaml#/components/schemas/PageResult'
        - type: object
          properties:
            list:
              type: array
              items:
                $ref: '#/components/schemas/ForumPostItem'
    ForumReplyItem:
      type: object
      required: [replyId, content, createdAt]
      properties:
        replyId:
          type: string
          example: freply_9f8e7d6c5b4a
        content:
          type: string
          example: 感谢分享，学到了
        authorName:
          type: string
          description: 回复人昵称（脱敏展示）
          example: 李*餐
        createdAt:
          type: string
          format: date-time
          example: '2026-01-15T11:00:00Z'
    ForumPostDetail:
      allOf:
        - $ref: '#/components/schemas/ForumPostItem'
        - type: object
          properties:
            content:
              type: string
              example: 分享一套自查清单……
            imageKeys:
              type: array
              items:
                type: string
            replies:
              type: array
              description: 回复列表
              items:
                $ref: '#/components/schemas/ForumReplyItem'
    ForumReplyRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: 回复内容（敏感词 + 人工复核）
