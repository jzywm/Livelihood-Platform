    ForumReplyResult:
      type: object
      required: [replyId]
      properties:
        replyId:
          type: string
          example: freply_9f8e7d6c5b4a
    ShopRecommendItem:
      type: object
      required: [merchantId, name, industry, creditScore, reviewRate]
      properties:
        merchantId:
          type: string
          example: m_20260825001
        name:
          type: string
          description: 小店名称（脱敏展示）
          example: 张*饭馆
        industry:
          type: string
          description: 行业
          example: 餐饮
