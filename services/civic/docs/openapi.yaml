          example: '2026-01-15T10:30:00Z'
    MerchantPostPage:
      allOf:
        - $ref: '../../_common/openapi.yaml#/components/schemas/PageResult'
        - type: object
          properties:
            list:
              type: array
              items:
                $ref: '#/components/schemas/MerchantPostItem'

