x-external-interfaces:
  description: |
    服务端间接口（内部调用），前端勿调，不在上方 paths 中。
    出方向依赖：
    - 互评/用工数据 → 评分事件上报 CRED（/cred/score/events，I-02 并入 A-07 商户信用/A-06 一人一档）；
    - 发薪履约维度由 SETTLE 发薪事件（MQ）供给更新（本服务不直连 SETTLE 库）；
    - 恶意差评申诉走 TICKET D-03（本服务不建第二套申诉）。
  endpoints:
    - method: GET
      path: /emp/attendance/summary
      tags: [attendance]
      summary: 代付考勤校验（服务端间，SETTLE → EMP）
      description: |
        SETTLE 发起工资代付前校验用工关系与考勤工时（SSOT §2.4 被依赖：SETTLE 代付考勤校验）；
        服务端间鉴权（内部 Token）；返回月度工时与校验结论。前端永远不调用此接口。
      parameters:
        - name: employmentId
          in: query
          required: true
          description: 用工关系编号
          schema:
            type: string
        - name: month
          in: query
          required: true
          description: 月份（YYYY-MM）
          schema:
            type: string
      responses:
        '200':
          description: 成功，返回工时与校验结论
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [employmentId, month, hours, checked]
                        properties:
                          employmentId:
                            type: string
                          month:
                            type: string
                          hours:
                            type: number
                            description: 月度累计工时
                          checked:
                            type: boolean
                            description: 考勤校验通过（工时缺失 → false，代付提示补录）
