components:
  schemas:
    QuoteRequest:
      type: object
      required: [address]
      properties:
        address:
          type: object
          description: 收货地址（GPS 定位/地图选点/常用地址三选一联动回填）
          required: [lng, lat, detail]
          properties:
            lng:
              type: number
              format: double
              description: 经度
              example: 114.51
            lat:
              type: number
              format: double
              description: 纬度
              example: 38.04
            detail:
              type: string
              description: 地址详情（脱敏存储）
              maxLength: 200
              example: 裕华区 XX 路 88 号
        merchantId:
          type: string
          description: 商户编号（可选，按商家配送范围校验）
          example: m_20260825001
        items:
          type: array
          description: 商品清单（配送费计算）
          items:
            type: object
            required: [itemId, qty]
            properties:
              itemId:
                type: string
              qty:
                type: integer
                format: int32
                minimum: 1
    QuoteResult:
      type: object
      required: [deliverable]
      properties:
        deliverable:
          type: boolean
          description: 是否可配送（超范围 false，前端禁用提交）
          example: true
        reason:
          type: string
          description: 不可配送原因
          example: 超出配送范围，请更换地址
        deliveryFee:
          type: number
          description: 配送费（元）
          example: 6
        estimatedMinutes:
          type: integer
          format: int32
          description: 预计送达（分钟）
          example: 35
    DeliveryOrderStatus:
      type: string
      description: |
        配送订单状态机（PDD §5.15.5 / PRD §6.10）：PENDING_PAYMENT 待支付 → PENDING_ACCEPT 待接单 →
        PREPARING 商户备货 → READY 待取货 → DELIVERING 配送中 → DELIVERED 已送达 → COMPLETED 已完成；
        分支：CANCELLED 已取消、ABNORMAL 异常。
      enum: [PENDING_PAYMENT, PENDING_ACCEPT, PREPARING, READY, DELIVERING, DELIVERED, COMPLETED, CANCELLED, ABNORMAL]
      example: DELIVERING
    DeliveryOrderCreateRequest:
      type: object
      required: [address, merchantId, items]
      properties:
        address:
          type: object
          description: 收货地址（位置最小化、脱敏存储，R-03/R-07）
          required: [lng, lat, detail]
          properties:
            lng:
              type: number
              format: double
              example: 114.51
            lat:
              type: number
              format: double
              example: 38.04
            detail:
              type: string
              maxLength: 200
              example: 裕华区 XX 路 88 号
        receiverName:
          type: string
          description: 收货人姓名（脱敏存储）
          maxLength: 50
          example: 李*
        receiverPhone:
          type: string
          description: 收货人电话（加密存储）
          maxLength: 20
          example: '138****5678'
        merchantId:
          type: string
          description: 商户编号
          example: m_20260825001
        items:
          type: array
          description: 商品清单
          items:
            type: object
            required: [itemId, qty]
            properties:
              itemId:
                type: string
              qty:
                type: integer
                format: int32
                minimum: 1
        remark:
          type: string
          description: 备注（可选）
          maxLength: 200
          example: 放前台即可
    OrderSubmitResult:
      type: object
      required: [orderId, status, deliveryFee]
      properties:
        orderId:
          type: string
          description: 配送单号
          example: D-2026090801
        status:
          $ref: '#/components/schemas/DeliveryOrderStatus'
        deliveryFee:
          type: number
          description: 配送费（元）
          example: 6
        estimatedAt:
          type: string
          format: date-time
          description: 预计送达时间
          example: '2026-09-08T12:45:00Z'
    DeliveryOrderItem:
      type: object
      required: [orderId, status, totalAmount, createdAt]
      properties:
        orderId:
          type: string
          example: D-2026090801
        merchantName:
          type: string
          description: 商家名称（脱敏展示）
          example: XX面馆
        status:
          $ref: '#/components/schemas/DeliveryOrderStatus'
        totalAmount:
          type: number
          description: 订单总额（元，含配送费）
          example: 27
        deliveryFee:
          type: number
          example: 6
        createdAt:
          type: string
          format: date-time
          example: '2026-09-08T12:10:00Z'
        estimatedAt:
          type: string
          format: date-time
          example: '2026-09-08T12:45:00Z'
    DeliveryOrderPage:
      allOf:
        - $ref: '../../_common/openapi.yaml#/components/schemas/PageResult'
        - type: object
          properties:
            list:
              type: array
              items:
                $ref: '#/components/schemas/DeliveryOrderItem'
    TimelineEvent:
      type: object
      required: [status, at]
      properties:
        status:
          $ref: '#/components/schemas/DeliveryOrderStatus'
        at:
          type: string
          format: date-time
          example: '2026-09-08T12:10:00Z'
    DeliveryOrderDetail:
      type: object
      required: [orderId, status, timeline, createdAt]
      properties:
        orderId:
          type: string
          example: D-2026090801
        address:
          type: string
          description: 收货地址（脱敏展示，R-03）
          example: 裕华区 XX 路 88 号
        receiverName:
          type: string
          example: 李*
        merchantName:
          type: string
          example: XX面馆
        items:
          type: array
          description: 商品清单
          items:
            type: object
            properties:
              name:
                type: string
              qty:
                type: integer
                format: int32
        totalAmount:
          type: number
          example: 27
        deliveryFee:
          type: number
          example: 6
        status:
          $ref: '#/components/schemas/DeliveryOrderStatus'
        riderName:
          type: string
          description: 骑手名称（脱敏展示，配送中后可见）
          example: 王*傅
        timeline:
          type: array
          description: 状态时间轴（全程进度可见）
          items:
            $ref: '#/components/schemas/TimelineEvent'
        estimatedAt:
          type: string
          format: date-time
          example: '2026-09-08T12:45:00Z'
        createdAt:
          type: string
          format: date-time
          example: '2026-09-08T12:10:00Z'
    TrackPoint:
      type: object
      required: [lng, lat, at]
      properties:
        lng:
          type: number
          format: double
          example: 114.511
        lat:
          type: number
          format: double
          example: 38.042
        at:
          type: string
          format: date-time
          example: '2026-09-08T12:30:00Z'
    TrackResult:
      type: object
      required: [orderId, points]
      properties:
        orderId:
          type: string
          example: D-2026090801
        points:
          type: array
          description: 轨迹点（分段加载，抽稀后）
          items:
            $ref: '#/components/schemas/TrackPoint'
        hash:
          type: string
          description: 轨迹存证哈希（时间戳 + 哈希，复用 P-02，只增不改）
          example: c8d4e1f0a9b2c3d4
    UrgeResult:
      type: object
      required: [orderId, urgedAt]
      properties:
        orderId:
          type: string
          example: D-2026090801
        urgedAt:
          type: string
          format: date-time
          example: '2026-09-08T12:50:00Z'
    ConfirmResult:
      type: object
      required: [orderId, status]
      properties:
        orderId:
          type: string
          example: D-2026090801
        status:
          type: string
          enum: [COMPLETED]
          example: COMPLETED
    MerchantOrderItem:
      allOf:
        - $ref: '#/components/schemas/DeliveryOrderItem'
        - type: object
          properties:
            deadlineAt:
              type: string
              format: date-time
              description: 接单/备货超时倒计时（超时自动处理并预警）
              example: '2026-09-08T12:12:00Z'
    MerchantOrderPage:
      allOf:
        - $ref: '../../_common/openapi.yaml#/components/schemas/PageResult'
        - type: object
          properties:
            list:
              type: array
              items:
                $ref: '#/components/schemas/MerchantOrderItem'
    AcceptResult:
      type: object
      required: [orderId, status]
      properties:
        orderId:
          type: string
          example: D-2026090801
        status:
          type: string
          enum: [PREPARING]
          example: PREPARING
    RejectRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          description: 拒单原因（留痕计入信用 A-07）
          maxLength: 500
          example: 高峰期无法按时出餐
    RejectResult:
      type: object
      required: [orderId, status]
      properties:
        orderId:
          type: string
          example: D-2026090801
        status:
          type: string
          enum: [CANCELLED]
          example: CANCELLED
    ProgressAction:
      type: string
      description: 备货/出餐上报动作（PREPARE 备货中 → READY 出餐完成/待取货）
      enum: [PREPARE, READY]
      example: PREPARE
    ProgressRequest:
      type: object
      required: [action]
      properties:
        action:
          $ref: '#/components/schemas/ProgressAction'
    ProgressResult:
      type: object
      required: [orderId, status]
      properties:
        orderId:
          type: string
          example: D-2026090801
        status:
          $ref: '#/components/schemas/DeliveryOrderStatus'
    TransferResult:
      type: object
      required: [orderId, status]
      properties:
        orderId:
          type: string
          example: D-2026090801
        status:
          type: string
          description: 转运营调度后状态（READY 待取货/待派单）
          enum: [READY]
          example: READY
    OpsOverview:
      type: object
      required: [orderCount, completionRate, abnormalCount, onlineRiders]
      properties:
        orderCount:
          type: integer
