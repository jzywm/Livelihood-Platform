x-external-interfaces:
  description: |
    服务端间接口（内部调用），前端勿调，不在上方 paths 中。
    出方向依赖：
    - 结算/退款复用 SETTLE（I-04 分账反向），轨迹存证复用 P-02，**本服务不重复建结算/存证体系**；
    - 骑手信用档案复用 CRED（A-06/F-03 思路）、拒单/履约事件上报 CRED 评分；
    - 超时/偏航/异常停留预警上报 DASH（A-08 聚合）；轨迹出证与纠纷仲裁复用 TICKET（D-02/T-15）；
    - 位置/轨迹手机 GPS 前端直连（不做北斗硬件对接，同 F-02）。
  endpoints:
    - method: POST
      path: /delivery/track
      tags: [order]
      summary: 骑手位置轨迹上报（前端直连 GPS，服务端间承载）
      description: |
        配送全程 GPS 点按时间戳 + 哈希写入存证链（L-06，复用 P-02）：骑手端 App 后置期间，
        由骑手侧临时载体（轻量页面/链接）前端直连上报；本接口供该载体调用，不在常规前端页面路由中。
        轨迹抽稀 + 分段存储；位置按 R-03 分级授权。前端业务页面永远不调用此接口。
      requestBody:
        description: 轨迹点上报（时间戳 + 哈希存证）
        content:
          application/json:
            schema:
              type: object
              required: [orderId, lng, lat, at]
              properties:
                orderId:
                  type: string
                  description: 配送单号
                lng:
                  type: number
                  format: double
                lat:
                  type: number
                  format: double
                at:
                  type: string
                  format: date-time
                  description: 定位时间戳
      responses:
        '200':
          description: 受理成功（存证写入，只增不改）
          content:
            application/json:
              schema:
                $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
