openapi: 3.0.3
info:
  title: 配送服务 DELIVERY · 接口文档
  version: 1.0.0
  description: |
    配送服务（DELIVERY）前端接口文档。模块 L 组：L-01 配送下单与地址定位选点、L-02 订单状态机与全程跟踪、
    L-03 商家接单与备货出餐、L-04 运营调度看板、L-05 运力管理、L-06 位置轨迹存证与异常预警。
    口径对齐：PDD §5.15（本地配送服务，页面结构 8 页）；需求口径 PRD §5.14（L 组，L-01~L-06）；
    边界依据 SSOT §2.14。**PDD §6.4 无 DELIVERY 接口草案（SSOT C-01），本文件按 8 页线框逐页映射设计。**
    - 本文件 paths 仅含前端可调接口，可直接喂 packages/api-client 生成 TS 类型。
    - 服务端间接口（骑手轨迹上报）见文末 x-external-interfaces 附录，前端勿调。
    - 公共组件（Envelope / PageResult / 错误码 / 分页 / 鉴权）引用 ../../_common/openapi.yaml，勿复制内联。
    - 红线：复用 SETTLE 结算与 P-02 存证，**不重复建结算/存证体系**；不做北斗硬件对接（位置/轨迹复用手机 GPS，同 F-02）；
      R-03 位置/轨迹分级授权（本人可见→授权可见→脱敏公示）、敏感个人信息加密存储（R-07）。
    - 里程碑：本服务为 M2 交付、**骑手端 App 后置**（骑手侧动作暂由运营端人工调度 + 运力档案承载）；
      全部接口为 M2 占位——里程碑交付前口径以评审为准。
servers:
  - url: https://api.example.com/api/v1
    description: 生产（示例域名）
  - url: http://localhost:8080/api/v1
    description: 本地开发（Java）
tags:
  - name: order
    description: 配送下单与订单跟踪（L-01/L-02，消费端）
  - name: merchant
    description: 商家接单与备货出餐（L-03，经营端）
  - name: ops
    description: 运营调度与运力管理（L-04/L-05/L-06，运营端 /ops）

security:
  - bearerAuth: []

paths:
  /delivery/quote:
    post:
      tags: [order]
      summary: 配送费报价与范围校验【M2 · L-01 占位】
      description: |
        下单前报价（L-01，线框 S-29）：**校验配送范围**——超范围 deliverable=false 并显式提示「超出配送范围，
        请更换地址」（前端禁用提交）；范围内返回配送费/预计送达分钟数。
        地址经 GPS 定位/地图选点/常用地址三选一联动回填；位置数据最小化使用、脱敏存储（R-03/R-07）。M2 占位。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
      responses:
        '200':
          description: 成功，返回可配送判定与报价（超范围 deliverable=false，非错误）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/QuoteResult'
        '400':
          $ref: '../../_common/openapi.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
  /delivery/orders:
    post:
      tags: [order]
      summary: 配送下单【M2 · L-01 占位】
      description: |
        生成配送订单（L-01，线框 S-29）：校验配送范围（超范围 → 1003 拦截提示更换地址）、
        计算配送费/预计送达；结算与退款复用 SETTLE（I-04 分账反向），本服务不重复建结算体系。
        位置数据最小化、脱敏存储（R-03/R-07）。M2 占位。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryOrderCreateRequest'
      responses:
        '200':
          description: 受理成功，返回配送单号与状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OrderSubmitResult'
        '400':
          $ref: '../../_common/openapi.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
        '422':
          description: 业务规则拦截（code=1003，超出配送范围，请更换地址）
          content:
            application/json:
              schema:
                $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
              example:
                code: 1003
                message: 超出配送范围，请更换地址
                data: null
                traceId: 3f2a1b9c8d7e6f50
                timestamp: '2026-01-15T10:30:00Z'
    get:
      tags: [order]
      summary: 我的配送订单列表（线框 S-30）【M2 · L-02 占位】
      description: |
        消费端「我的配送订单」（S-30）：状态筛选 Tab + 订单列表（状态徽章+商家+金额+时间），分页；
        仅本人可见（2002 拦截）。M2 占位。
      parameters:
        - $ref: '../../_common/openapi.yaml#/components/parameters/Page'
        - $ref: '../../_common/openapi.yaml#/components/parameters/PageSize'
        - name: status
          in: query
          required: false
          description: 状态筛选
          schema:
            $ref: '#/components/schemas/DeliveryOrderStatus'
      responses:
        '200':
          description: 成功，返回我的配送订单（分页）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DeliveryOrderPage'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
  /delivery/orders/{orderId}:
    get:
      tags: [order]
      summary: 配送订单详情 + 状态时间轴（线框 S-31）【M2 · L-02 占位】
      description: |
        订单详情（S-31）：状态时间轴 + 预计送达 + 操作区（催单/投诉/确认收货）；骑手实时位置与轨迹
        走 GET /delivery/orders/{orderId}/track；仅当事方/运营可见（2002 拦截）。M2 占位。
      parameters:
        - name: orderId
          in: path
          required: true
          description: 配送单号
          schema:
            type: string
            example: D-2026090801
      responses:
        '200':
          description: 成功，返回订单详情与时间轴
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DeliveryOrderDetail'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../_common/openapi.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../../_common/openapi.yaml#/components/responses/NotFound'
  /delivery/orders/{orderId}/track:
    get:
      tags: [order]
      summary: 骑手位置与轨迹存证查询（线框 S-31 地图）【M2 · L-02/L-06 占位】
      description: |
        配送全程位置轨迹查询（S-31 地图 + L-06）：轨迹点时间戳 + 哈希存证（复用 P-02，只增不改）、
        分段加载（README §4.2 轨迹抽稀 + 分段加载降低带宽）；按 R-03 分级授权（本人可见→授权可见→脱敏）；
        轨迹可出证供纠纷仲裁（复用 TICKET D-02/T-15 机制，本服务不建出证体系）。M2 占位。
      parameters:
        - name: orderId
          in: path
          required: true
          description: 配送单号
          schema:
            type: string
            example: D-2026090801
      responses:
        '200':
          description: 成功，返回轨迹点与存证哈希
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TrackResult'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../_common/openapi.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../../_common/openapi.yaml#/components/responses/NotFound'
  /delivery/orders/{orderId}/urge:
    post:
      tags: [order]
      summary: 催单（消费者/运营共用）【M2 · L-02/L-04 占位】
      description: |
        消费者对配送中订单催单（S-30/S-31），运营端也可代催（O-02）；催单留痕审计（L-04 治理口径）；
        非配送中状态 → 3007。M2 占位。
      parameters:
        - name: orderId
          in: path
          required: true
          description: 配送单号
          schema:
            type: string
            example: D-2026090801
      responses:
        '200':
          description: 成功，催单已触达（留痕）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UrgeResult'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
        '404':
          $ref: '../../_common/openapi.yaml#/components/responses/NotFound'
        '422':
          description: 状态不允许（code=3007，非配送中状态不可催单）
          content:
            application/json:
              schema:
                $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
              example:
                code: 3007
                message: 状态不允许该操作
                data: null
                traceId: 3f2a1b9c8d7e6f50
                timestamp: '2026-01-15T10:30:00Z'
  /delivery/orders/{orderId}/confirm:
    post:
      tags: [order]
      summary: 确认收货（已送达 → 已完成）【M2 · L-02 占位】
      description: |
        消费者确认收货（S-31 操作区）：已送达 → 已完成；仅消费者本人可确认（2002）；非已送达状态 → 3007。
        M2 占位。
      parameters:
        - name: orderId
          in: path
          required: true
          description: 配送单号
          schema:
            type: string
            example: D-2026090801
      responses:
        '200':
          description: 成功，订单已完成
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ConfirmResult'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../_common/openapi.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../../_common/openapi.yaml#/components/responses/NotFound'
        '422':
          description: 状态不允许（code=3007，非已送达状态不可确认收货）
          content:
            application/json:
              schema:
                $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
              example:
                code: 3007
                message: 状态不允许该操作
                data: null
                traceId: 3f2a1b9c8d7e6f50
                timestamp: '2026-01-15T10:30:00Z'
  /delivery/orders/merchant:
    get:
      tags: [merchant]
      summary: 商户配送订单列表（线框 M-40）【M2 · L-03 占位】
      description: |
        经营端「配送订单管理」（M-40）：状态筛选 Tab + 订单列表（超时倒计时）+ 操作区
        （接单/拒单/备货/出餐/转调度）；仅本商户可见（2002 拦截）。M2 占位。
      parameters:
        - $ref: '../../_common/openapi.yaml#/components/parameters/Page'
        - $ref: '../../_common/openapi.yaml#/components/parameters/PageSize'
        - name: status
          in: query
          required: false
          description: 状态筛选
          schema:
            $ref: '#/components/schemas/DeliveryOrderStatus'
      responses:
        '200':
          description: 成功，返回商户配送订单（分页）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MerchantOrderPage'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../_common/openapi.yaml#/components/responses/Forbidden'
  /delivery/orders/{orderId}/accept:
    post:
      tags: [merchant]
      summary: 商家接单（待接单 → 商户备货）【M2 · L-03 占位】
      description: |
        商户接单（M-40 操作区）：二次确认；超时未接自动拒单转运营调度并预警（系统动作）；
        仅本商户可接（2002）；非待接单状态 → 3007。M2 占位。
      parameters:
        - name: orderId
          in: path
          required: true
          description: 配送单号
          schema:
            type: string
            example: D-2026090801
      responses:
        '200':
          description: 成功，订单进入商户备货
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AcceptResult'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../_common/openapi.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../../_common/openapi.yaml#/components/responses/NotFound'
        '422':
          description: 状态不允许（code=3007，非待接单状态）
          content:
            application/json:
              schema:
                $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
              example:
                code: 3007
                message: 状态不允许该操作
                data: null
                traceId: 3f2a1b9c8d7e6f50
                timestamp: '2026-01-15T10:30:00Z'
  /delivery/orders/{orderId}/reject:
    post:
      tags: [merchant]
      summary: 商家拒单（留痕计入信用）【M2 · L-03 占位】
      description: |
        商户拒单（M-40 操作区）：二次确认；**拒单原因留痕计入信用（A-07）**；仅本商户可拒（2002）；
        非待接单状态 → 3007。M2 占位。
      parameters:
        - name: orderId
          in: path
          required: true
          description: 配送单号
          schema:
            type: string
            example: D-2026090801
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRequest'
      responses:
        '200':
          description: 成功，订单已拒单（原因留痕计信用）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RejectResult'
        '400':
          $ref: '../../_common/openapi.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../_common/openapi.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../../_common/openapi.yaml#/components/responses/NotFound'
        '422':
          description: 状态不允许（code=3007，非待接单状态）
          content:
            application/json:
              schema:
                $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
              example:
                code: 3007
                message: 状态不允许该操作
                data: null
                traceId: 3f2a1b9c8d7e6f50
                timestamp: '2026-01-15T10:30:00Z'
  /delivery/orders/{orderId}/progress:
    post:
      tags: [merchant]
      summary: 备货/出餐状态上报【M2 · L-03 占位】
      description: |
        备货/出餐一键上报（M-40 操作区）：PREPARE 备货中（商户备货）、READY 出餐完成（待取货）；
        仅本商户可上报（2002）；状态不允许 → 3007。M2 占位。
      parameters:
        - name: orderId
          in: path
          required: true
          description: 配送单号
          schema:
            type: string
            example: D-2026090801
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgressRequest'
      responses:
        '200':
          description: 成功，返回最新状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProgressResult'
        '400':
          $ref: '../../_common/openapi.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../_common/openapi.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../../_common/openapi.yaml#/components/responses/NotFound'
        '422':
          description: 状态不允许（code=3007）
          content:
            application/json:
              schema:
                $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
              example:
                code: 3007
                message: 状态不允许该操作
                data: null
                traceId: 3f2a1b9c8d7e6f50
                timestamp: '2026-01-15T10:30:00Z'
  /delivery/orders/{orderId}/transfer:
    post:
      tags: [merchant]
      summary: 请求取货 / 转运营调度【M2 · L-03 占位】
      description: |
        出餐完成后请求取货，骑手不可达/异常时转运营调度（M-40 操作区）：订单转运营端人工派单；
        仅本商户可操作（2002）；状态不允许 → 3007。M2 占位。
      parameters:
        - name: orderId
          in: path
          required: true
          description: 配送单号
          schema:
            type: string
            example: D-2026090801
      responses:
        '200':
          description: 成功，订单已转运营调度（待取货/待派单）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TransferResult'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../_common/openapi.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../../_common/openapi.yaml#/components/responses/NotFound'
        '422':
          description: 状态不允许（code=3007）
          content:
            application/json:
              schema:
                $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
              example:
                code: 3007
                message: 状态不允许该操作
                data: null
                traceId: 3f2a1b9c8d7e6f50
                timestamp: '2026-01-15T10:30:00Z'
  /delivery/ops/overview:
    get:
      tags: [ops]
      summary: 配送运营工作台总览（线框 O-01）【M2 · L-04 占位】
      description: |
        运营工作台今日总览（O-01）：订单量/履约率/异常数/在线运力 + 待办（待派单/超时/偏航）；
        `/ops` 仅平台运营角色可见（2002 拦截）。M2 占位。
      responses:
        '200':
          description: 成功，返回今日总览与待办
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OpsOverview'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../_common/openapi.yaml#/components/responses/Forbidden'
  /delivery/ops/orders:
    get:
      tags: [ops]
      summary: 运营全量配送订单（线框 O-02）【M2 · L-04 占位】
      description: |
        运营端全量订单列表（O-02）：待派单/配送中/异常/已完成筛选，分页；
        操作区（派单/改派/取消/催单）处置留痕可审计（L-04 治理口径）；需运营角色（2002）。M2 占位。
      parameters:
        - $ref: '../../_common/openapi.yaml#/components/parameters/Page'
