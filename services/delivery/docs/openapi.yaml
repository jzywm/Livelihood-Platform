      summary: 运力管理 · 骑手列表（线框 O-04）【M2 · L-05 占位】
      description: |
        骑手/配送员档案列表（O-04）：实名/健康证/履约率/在线状态，分页；骑手端（D-01~D-03）M2 交付、设计先行，
        本页为运营端运力档案；需运营角色（2002）。M2 占位。
      parameters:
        - $ref: '../../_common/openapi.yaml#/components/parameters/Page'
        - $ref: '../../_common/openapi.yaml#/components/parameters/PageSize'
        - name: onlineStatus
          in: query
          required: false
          description: 在线状态筛选
          schema:
            $ref: '#/components/schemas/RiderOnlineStatus'
      responses:
        '200':
          description: 成功，返回骑手列表（分页）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RiderPage'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../_common/openapi.yaml#/components/responses/Forbidden'
  /delivery/ops/riders/{riderId}:
    get:
      tags: [ops]
      summary: 骑手档案详情（线框 O-04 查看档案）【M2 · L-05 占位】
      description: |
        骑手档案（L-05）：实名、健康证、背景核验（复用 A-06/F-03 思路）、信用档案
        （接单履约率/超时/投诉）；需运营角色（2002）。M2 占位。
      parameters:
        - name: riderId
          in: path
          required: true
          description: 骑手编号
          schema:
            type: string
            example: r_20260901001
      responses:
        '200':
          description: 成功，返回骑手档案
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RiderDetail'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../_common/openapi.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../../_common/openapi.yaml#/components/responses/NotFound'
  /delivery/ops/riders/{riderId}/status:
    post:
      tags: [ops]
      summary: 骑手停用/启用（线框 O-04）【M2 · L-05 占位】
      description: |
        骑手停用/启用（O-04）：停用需二次确认并留痕；需运营角色（2002）。M2 占位。
      parameters:
        - name: riderId
          in: path
          required: true
          description: 骑手编号
          schema:
            type: string
            example: r_20260901001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiderStatusRequest'
      responses:
        '200':
          description: 成功，返回停用/启用结果（留痕）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RiderStatusResult'
        '400':
          $ref: '../../_common/openapi.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../_common/openapi.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../../_common/openapi.yaml#/components/responses/NotFound'
  /delivery/ops/riders/locations:
    get:
      tags: [ops]
      summary: 骑手实时位置（调度看板地图，线框 O-03）【M2 · L-04 占位】
      description: |
        调度看板地图（O-03）：在线骑手实时位置（订单热力 + 骑手位置一屏可见）；
        位置按 R-03 分级授权、最小化展示；需运营角色（2002）。M2 占位。
      responses:
        '200':
          description: 成功，返回在线骑手实时位置
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../../_common/openapi.yaml#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RiderLocationsResult'
        '401':
          $ref: '../../_common/openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../_common/openapi.yaml#/components/responses/Forbidden'

components:
  schemas:
    QuoteRequest:
      type: object
      required: [address]
      properties:
        address:
          type: object
          description: 收货地址（GPS 定位/地图选点/常用地址三选一联动回填）
          required: [lng, lat, detail]
          properties:
            lng:
              type: number
              format: double
              description: 经度
              example: 114.51
            lat:
              type: number
              format: double
              description: 纬度
              example: 38.04
            detail:
              type: string
              description: 地址详情（脱敏存储）
              maxLength: 200
              example: 裕华区 XX 路 88 号
        merchantId:
          type: string
          description: 商户编号（可选，按商家配送范围校验）
          example: m_20260825001
        items:
          type: array
          description: 商品清单（配送费计算）
          items:
            type: object
            required: [itemId, qty]
            properties:
              itemId:
                type: string
              qty:
                type: integer
                format: int32
                minimum: 1
        cargo:
          $ref: '#/components/schemas/CargoSpec'
    QuoteResult:
      type: object
      required: [deliverable]
      properties:
        deliverable:
          type: boolean
          description: 是否可配送（超范围 false，前端禁用提交）
          example: true
        reason:
          type: string
          description: 不可配送原因
          example: 超出配送范围，请更换地址
        deliveryFee:
          type: number
          description: 配送费（元）
          example: 6
        estimatedMinutes:
          type: integer
          format: int32
          description: 预计送达（分钟）
          example: 35
        vehicleRequired:
          $ref: '#/components/schemas/VehicleType'
    DeliveryOrderStatus:
      type: string
      description: |
        配送订单状态机（PDD §5.15.5 / PRD §6.10）：PENDING_PAYMENT 待支付 → PENDING_ACCEPT 待接单 →
        PREPARING 商户备货 → READY 待取货 → DELIVERING 配送中 → DELIVERED 已送达 → COMPLETED 已完成；
        分支：CANCELLED 已取消、ABNORMAL 异常。
      enum: [PENDING_PAYMENT, PENDING_ACCEPT, PREPARING, READY, DELIVERING, DELIVERED, COMPLETED, CANCELLED, ABNORMAL]
      example: DELIVERING
    DeliveryOrderCreateRequest:
      type: object
      required: [address, merchantId, items]
      properties:
        address:
          type: object
          description: 收货地址（位置最小化、脱敏存储，R-03/R-07）
          required: [lng, lat, detail]
          properties:
            lng:
              type: number
              format: double
              example: 114.51
            lat:
              type: number
              format: double
              example: 38.04
            detail:
              type: string
              maxLength: 200
              example: 裕华区 XX 路 88 号
        receiverName:
          type: string
          description: 收货人姓名（脱敏存储）
          maxLength: 50
          example: 李*
        receiverPhone:
          type: string
          description: 收货人电话（加密存储）
          maxLength: 20
          example: '138****5678'
        merchantId:
          type: string
          description: 商户编号
          example: m_20260825001
        items:
          type: array
          description: 商品清单
          items:
            type: object
            required: [itemId, qty]
            properties:
              itemId:
                type: string
              qty:
                type: integer
                format: int32
                minimum: 1
        cargo:
          $ref: '#/components/schemas/CargoSpec'
        remark:
          type: string
          description: 备注（可选）
          maxLength: 200
          example: 放前台即可
    OrderSubmitResult:
      type: object
      required: [orderId, status, deliveryFee]
      properties:
        orderId:
          type: string
          description: 配送单号
          example: D-2026090801
        status:
          $ref: '#/components/schemas/DeliveryOrderStatus'
        deliveryFee:
          type: number
          description: 配送费（元）
          example: 6
        estimatedAt:
          type: string
          format: date-time
          description: 预计送达时间
          example: '2026-09-08T12:45:00Z'
    DeliveryOrderItem:
      type: object
      required: [orderId, status, totalAmount, createdAt]
      properties:
        orderId:
          type: string
          example: D-2026090801
        merchantName:
          type: string
          description: 商家名称（脱敏展示）
          example: XX面馆
        status:
          $ref: '#/components/schemas/DeliveryOrderStatus'
        totalAmount:
          type: number
          description: 订单总额（元，含配送费）
          example: 27
        deliveryFee:
          type: number
          example: 6
        createdAt:
          type: string
          format: date-time
          example: '2026-09-08T12:10:00Z'
        estimatedAt:
          type: string
          format: date-time
          example: '2026-09-08T12:45:00Z'
    DeliveryOrderPage:
      allOf:
        - $ref: '../../_common/openapi.yaml#/components/schemas/PageResult'
        - type: object
          properties:
            list:
              type: array
              items:
                $ref: '#/components/schemas/DeliveryOrderItem'
    TimelineEvent:
      type: object
      required: [status, at]
      properties:
        status:
          $ref: '#/components/schemas/DeliveryOrderStatus'
        at:
          type: string
          format: date-time
          example: '2026-09-08T12:10:00Z'
    DeliveryOrderDetail:
      type: object
      required: [orderId, status, timeline, createdAt]
      properties:
        orderId:
          type: string
          example: D-2026090801
        address:
          type: string
          description: 收货地址（脱敏展示，R-03）
          example: 裕华区 XX 路 88 号
        receiverName:
          type: string
          example: 李*
        merchantName:
          type: string
          example: XX面馆
        items:
          type: array
          description: 商品清单
          items:
            type: object
            properties:
              name:
                type: string
              qty:
                type: integer
                format: int32
        totalAmount:
          type: number
          example: 27
        deliveryFee:
          type: number
          example: 6
        status:
          $ref: '#/components/schemas/DeliveryOrderStatus'
        riderName:
          type: string
          description: 骑手名称（脱敏展示，配送中后可见）
          example: 王*傅
        timeline:
          type: array
          description: 状态时间轴（全程进度可见）
          items:
            $ref: '#/components/schemas/TimelineEvent'
        estimatedAt:
          type: string
          format: date-time
          example: '2026-09-08T12:45:00Z'
        createdAt:
          type: string
          format: date-time
          example: '2026-09-08T12:10:00Z'
    TrackPoint:
      type: object
      required: [lng, lat, at]
      properties:
        lng:
          type: number
          format: double
          example: 114.511
        lat:
          type: number
          format: double
          example: 38.042
        at:
          type: string
          format: date-time
          example: '2026-09-08T12:30:00Z'
    TrackResult:
      type: object
      required: [orderId, points]
      properties:
        orderId:
          type: string
          example: D-2026090801
        points:
          type: array
          description: 轨迹点（分段加载，抽稀后）
          items:
            $ref: '#/components/schemas/TrackPoint'
        hash:
          type: string
          description: 轨迹存证哈希（时间戳 + 哈希，复用 P-02，只增不改）
          example: c8d4e1f0a9b2c3d4
    UrgeResult:
      type: object
      required: [orderId, urgedAt]
      properties:
        orderId:
          type: string
          example: D-2026090801
        urgedAt:
          type: string
          format: date-time
          example: '2026-09-08T12:50:00Z'
    ConfirmResult:
      type: object
      required: [orderId, status]
      properties:
        orderId:
          type: string
          example: D-2026090801
        status:
          type: string
          enum: [COMPLETED]
          example: COMPLETED
    MerchantOrderItem:
      allOf:
        - $ref: '#/components/schemas/DeliveryOrderItem'
        - type: object
          properties:
            deadlineAt:
              type: string
              format: date-time
              description: 接单/备货超时倒计时（超时自动处理并预警）
              example: '2026-09-08T12:12:00Z'
    MerchantOrderPage:
      allOf:
        - $ref: '../../_common/openapi.yaml#/components/schemas/PageResult'
        - type: object
          properties:
            list:
              type: array
              items:
                $ref: '#/components/schemas/MerchantOrderItem'
    AcceptResult:
      type: object
      required: [orderId, status]
      properties:
        orderId:
          type: string
          example: D-2026090801
        status:
          type: string
          enum: [PREPARING]
          example: PREPARING
    RejectRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          description: 拒单原因（留痕计入信用 A-07）
          maxLength: 500
          example: 高峰期无法按时出餐
    RejectResult:
      type: object
      required: [orderId, status]
      properties:
        orderId:
          type: string
          example: D-2026090801
        status:
          type: string
          enum: [CANCELLED]
          example: CANCELLED
    ProgressAction:
      type: string
      description: 备货/出餐上报动作（PREPARE 备货中 → READY 出餐完成/待取货）
      enum: [PREPARE, READY]
      example: PREPARE
    ProgressRequest:
      type: object
      required: [action]
      properties:
        action:
          $ref: '#/components/schemas/ProgressAction'
    ProgressResult:
      type: object
      required: [orderId, status]
      properties:
        orderId:
          type: string
          example: D-2026090801
        status:
          $ref: '#/components/schemas/DeliveryOrderStatus'
    TransferResult:
      type: object
      required: [orderId, status]
      properties:
        orderId:
          type: string
          example: D-2026090801
        status:
          type: string
          description: 转运营调度后状态（READY 待取货/待派单）
          enum: [READY]
          example: READY
    OpsOverview:
      type: object
      required: [orderCount, completionRate, abnormalCount, onlineRiders]
      properties:
        orderCount:
          type: integer
          format: int32
          description: 今日订单量
          example: 328
        completionRate:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: 履约率
          example: 0.95
        abnormalCount:
          type: integer
          format: int32
          description: 异常订单数
          example: 6
        onlineRiders:
          type: integer
          format: int32
          description: 在线运力
          example: 12
        pendingAssign:
          type: integer
          format: int32
          description: 待派单
          example: 5
        overdue:
          type: integer
          format: int32
          description: 超时订单
          example: 2
        deviation:
          type: integer
          format: int32
          description: 偏航
          example: 1
    OpsOrderItem:
      type: object
      required: [orderId, status, createdAt]
      properties:
        orderId:
          type: string
          example: D-2026090801
        merchantName:
          type: string
          description: 商家名称（脱敏展示）
          example: XX面馆
        riderName:
          type: string
          description: 骑手名称（脱敏展示，未派单为空）
          example: 王*傅
        status:
          $ref: '#/components/schemas/DeliveryOrderStatus'
        createdAt:
          type: string
          format: date-time
          example: '2026-09-08T12:10:00Z'
    OpsOrderPage:
      allOf:
        - $ref: '../../_common/openapi.yaml#/components/schemas/PageResult'
        - type: object
          properties:
            list:
              type: array
              items:
                $ref: '#/components/schemas/OpsOrderItem'
    AssignRequest:
      type: object
      required: [riderId]
      properties:
        riderId:
          type: string
          description: 骑手编号
          example: r_20260901001
    AssignResult:
      type: object
      required: [orderId, riderId, status]
      properties:
        orderId:
          type: string
          example: D-2026090801
        riderId:
          type: string
          example: r_20260901001
        status:
          type: string
          enum: [DELIVERING]
          example: DELIVERING
    ReassignRequest:
      type: object
      required: [riderId]
      properties:
        riderId:
          type: string
          description: 新骑手编号
          example: r_20260901002
        reason:
          type: string
          description: 改派原因（留痕审计）
          maxLength: 500
          example: 原骑手车辆故障
    CancelRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          description: 取消原因（展示 + 留痕）
          maxLength: 500
          example: 商家无法履约
    CancelResult:
      type: object
      required: [orderId, status]
      properties:
        orderId:
          type: string
          example: D-2026090801
        status:
          type: string
          enum: [CANCELLED]
          example: CANCELLED
    DeliveryAlertType:
      type: string
      description: 配送异常类型（L-06：超时/偏航/异常停留）
      enum: [OVERDUE, DEVIATION, ABNORMAL_STAY]
      example: OVERDUE
    OpsAlertItem:
      type: object
      required: [alertId, orderId, type, detectedAt, status]
      properties:
        alertId:
          type: string
          description: 预警编号
          example: dal_8f7e6d5c4b3a
        orderId:
          type: string
          example: D-2026090719
        type:
          $ref: '#/components/schemas/DeliveryAlertType'
        detail:
          type: string
          description: 异常详情
          example: 超出预计送达时间 15 分钟
        detectedAt:
          type: string
          format: date-time
          example: '2026-09-08T12:30:00Z'
        status:
          type: string
          description: 处理状态（人工处置，C8）
          enum: [OPEN, RESOLVED]
          example: OPEN
    OpsAlertPage:
      allOf:
        - $ref: '../../_common/openapi.yaml#/components/schemas/PageResult'
        - type: object
          properties:
            list:
              type: array
              items:
                $ref: '#/components/schemas/OpsAlertItem'
    RiderOnlineStatus:
      type: string
      description: 骑手在线状态（O-04）
      enum: [ONLINE, DELIVERING, OFFLINE]
      example: ONLINE
    RiderItem:
      type: object
      required: [riderId, name, completionRate, onlineStatus, enabled]
      properties:
        riderId:
          type: string
          example: r_20260901001
        name:
          type: string
          description: 骑手姓名（脱敏展示）
          example: 王*傅
        realnameStatus:
          type: boolean
          description: 实名核验状态
          example: true
        healthCertStatus:
          type: string
          description: 健康证状态（VALID/EXPIRING/INVALID）
          enum: [VALID, EXPIRING, INVALID]
          example: VALID
        completionRate:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: 接单履约率
          example: 0.98
        onlineStatus:
          $ref: '#/components/schemas/RiderOnlineStatus'
        enabled:
          type: boolean
          description: 启用状态（停用后不可派单）
          example: true
    RiderPage:
      allOf:
        - $ref: '../../_common/openapi.yaml#/components/schemas/PageResult'
        - type: object
          properties:
            list:
              type: array
              items:
                $ref: '#/components/schemas/RiderItem'
    RiderDetail:
      allOf:
        - $ref: '#/components/schemas/RiderItem'
        - type: object
          properties:
            healthCert:
              type: object
              description: 健康证（复用 A-06/F-03 思路）
              properties:
                status:
                  type: string
                  enum: [VALID, EXPIRING, INVALID]
                  example: VALID
                validTo:
                  type: string
                  format: date
                  example: '2027-01-31'
            backgroundCheck:
              type: string
              description: 背景核验状态
              enum: [PASSED, PENDING, REJECTED]
              example: PASSED
            overdueRate:
              type: number
              format: float
              minimum: 0
              maximum: 1
              description: 超时率
              example: 0.01
            complaintCount:
              type: integer
              format: int32
              description: 投诉数（信用档案，复用 A-06/F-03 思路）
              example: 0
    RiderStatusRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          description: DISABLE 停用 / ENABLE 启用
          enum: [DISABLE, ENABLE]
          example: DISABLE
        reason:
          type: string
          description: 停用原因（停用必填，留痕）
          maxLength: 500
          example: 健康证过期
    RiderStatusResult:
      type: object
      required: [riderId, enabled]
      properties:
        riderId:
          type: string
          example: r_20260901001
        enabled:
          type: boolean
          example: false
    RiderLocation:
      type: object
      required: [riderId, lng, lat, onlineStatus]
      properties:
        riderId:
          type: string
          example: r_20260901001
        name:
          type: string
          description: 骑手姓名（脱敏展示）
          example: 王*傅
        lng:
          type: number
          format: double
          example: 114.511
        lat:
          type: number
          format: double
          example: 38.042
        onlineStatus:
          $ref: '#/components/schemas/RiderOnlineStatus'
        currentOrderId:
          type: string
          description: 当前配送单（配送中时有值）
          example: D-2026090802
    RiderLocationsResult:
      type: object
      required: [riders]
      properties:
        riders:
          type: array
          description: 在线骑手实时位置（R-03 分级授权、最小化展示）
          items:
            $ref: '#/components/schemas/RiderLocation'
    VehicleType:
      type: string
      description: |
        骑手车辆类型（L-07，2026-09-11 新增）：E_BIKE 电动车（两轮，常规小件）/
        CAR 汽车（四轮，可运输大型货物）；派单按运单 vehicleRequired 匹配。
      enum: [E_BIKE, CAR]
      example: E_BIKE
    CargoType:
      type: string
      description: 货件类型（L-07）：NORMAL 常规 / OVERSIZED 大件（需 CAR 车型）
      enum: [NORMAL, OVERSIZED]
      example: NORMAL
    CargoSpec:
      type: object
      description: 货件规格（L-07，下单时填写；OVERSIZED 时 weightKg/volumeM3 必填）
      required: [cargoType]
      properties:
        cargoType:
          $ref: '#/components/schemas/CargoType'
        weightKg:
          type: number
          format: double
          description: 重量（kg，大件必填）
          example: 120
        volumeM3:
          type: number
          format: double
          description: 体积（m³，大件必填）
          example: 1.5
    NavTarget:
      type: object
      description: 导航目标点（地图开放平台导航参数：坐标 + 名称；前端按车型拼导航 URI）
      required: [name, lng, lat]
      properties:
        name:
          type: string
          description: 地点名称（商铺名/收货地址）
          example: XX面馆
        lng:
          type: number
          format: double
          example: 114.511
        lat:
          type: number
          format: double
          example: 38.042
        detail:
          type: string
          description: 地址详情（脱敏存储 R-07）
          example: 裕华区 XX 路 88 号
    RiderTaskItem:
      type: object
      required: [orderId, status, pickup, dropoff, vehicleRequired, createdAt]
      properties:
        orderId:
          type: string
          example: D-2026090801
        status:
          $ref: '#/components/schemas/DeliveryOrderStatus'
        pickup:
          $ref: '#/components/schemas/NavTarget'
        dropoff:
          $ref: '#/components/schemas/NavTarget'
        cargo:
          $ref: '#/components/schemas/CargoSpec'
        vehicleRequired:
          $ref: '#/components/schemas/VehicleType'
        estimatedAt:
          type: string
          format: date-time
          example: '2026-09-08T12:45:00Z'
        createdAt:
          type: string
          format: date-time
          example: '2026-09-08T12:10:00Z'
    RiderTaskPage:
      allOf:
        - $ref: '../../_common/openapi.yaml#/components/schemas/PageResult'
        - type: object
          properties:
            list:
              type: array
              items:
                $ref: '#/components/schemas/RiderTaskItem'
    RiderAcceptResult:
      type: object
      required: [orderId, status]
      properties:
        orderId:
          type: string
          example: D-2026090801
        status:
          type: string
          enum: [DELIVERING]
          example: DELIVERING
    RiderOrderDetail:
      allOf:
        - $ref: '#/components/schemas/RiderTaskItem'
        - type: object
          properties:
            receiverName:
              type: string
              description: 收货人姓名（脱敏展示）
              example: 李*
            receiverPhone:
              type: string
              description: 收货人电话（脱敏，联系买家用）
              example: '138****5678'
            items:
              type: array
              description: 商品清单（取货核对）
              items:
                type: object
                properties:
                  name:
                    type: string
                  qty:
                    type: integer
                    format: int32
            navMode:
              type: string
              description: 导航模式（按骑手车型映射：E_BIKE→BIKE 骑行 / CAR→DRIVE 驾车；前端拼地图开放平台 URI）
              enum: [BIKE, DRIVE]
              example: DRIVE
    RiderStatusAction:
      type: string
      description: 骑手状态上报动作（PICKUP 已取货 / DELIVERED 已送达）
      enum: [PICKUP, DELIVERED]
      example: PICKUP
    RiderOrderStatusRequest:
      type: object
      required: [action]
      properties:
        action:
          $ref: '#/components/schemas/RiderStatusAction'
    RiderOrderStatusResult:
      type: object
      required: [orderId, status]
      properties:
        orderId:
          type: string
          example: D-2026090801
        status:
          $ref: '#/components/schemas/DeliveryOrderStatus'
    RiderLocationReport:
      type: object
      required: [orderId, lng, lat]
      properties:
        orderId:
          type: string
          description: 当前配送单
          example: D-2026090801
        lng:
          type: number
          format: double
          example: 114.511
        lat:
          type: number
          format: double
          example: 38.042
        at:
          type: string
          format: date-time
          description: 定位时间戳（缺省服务端时间）
          example: '2026-09-08T12:30:00Z'
    RiderLocationAck:
      type: object
      required: [orderId, acceptedAt]
      properties:
        orderId:
          type: string
          example: D-2026090801
        acceptedAt:
          type: string
          format: date-time
          example: '2026-09-08T12:30:00Z'
    RiderProfileDetail:
      type: object
      required: [riderId, name, vehicleType, healthCertStatus]
      properties:
        riderId:
          type: string
          example: r_20260901001
        name:
          type: string
          description: 骑手姓名（本人可见完整，他人脱敏）
          example: 王*傅
        vehicleType:
          $ref: '#/components/schemas/VehicleType'
        vehicleNo:
          type: string
          description: 车牌号（密文存储，输出脱敏如 冀A·***88）
          example: 冀A·***88
        maxLoadKg:
          type: number
          format: double
          description: 最大载重（kg）
          example: 500
        maxVolumeM3:
          type: number
          format: double
          description: 最大容积（m³）
          example: 3
        healthCertStatus:
          type: string
          enum: [VALID, EXPIRING, INVALID]
          example: VALID
        healthCertValidTo:
          type: string
          format: date
          example: '2027-01-31'
        backgroundCheck:
          type: string
          enum: [PASSED, PENDING, REJECTED]
          example: PASSED
        completionRate:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: 接单履约率（收入速览/信用）
          example: 0.98
        enabled:
          type: boolean
          description: 启用状态（停用后不可派单）
          example: true
    RiderProfileUpdateRequest:
      type: object
      required: [vehicleType]
      properties:
        vehicleType:
          $ref: '#/components/schemas/VehicleType'
        vehicleNo:
          type: string
          description: 车牌号（密文存储）
          maxLength: 20
          example: 冀A12345
        maxLoadKg:
          type: number
          format: double
          description: 最大载重（kg）
          example: 500
        maxVolumeM3:
          type: number
          format: double
          description: 最大容积（m³）
          example: 3
    RiderRealtimeLocation:
      type: object
      required: [orderId, lng, lat, updatedAt]
      properties:
        orderId:
          type: string
          example: D-2026090801
        riderName:
          type: string
          description: 骑手姓名（脱敏展示）
          example: 王*傅
        vehicleType:
          $ref: '#/components/schemas/VehicleType'
        lng:
          type: number
          format: double
          example: 114.511
        lat:
          type: number
          format: double
          example: 38.042
        updatedAt:
          type: string
          format: date-time
          description: 位置更新时间
          example: '2026-09-08T12:30:00Z'

x-external-interfaces:
  description: |
    服务端间接口（内部调用），前端勿调，不在上方 paths 中。
    出方向依赖：
    - 结算/退款复用 SETTLE（I-04 分账反向），轨迹存证复用 P-02，**本服务不重复建结算/存证体系**；
    - 骑手信用档案复用 CRED（A-06/F-03 思路）、拒单/履约事件上报 CRED 评分；
    - 超时/偏航/异常停留预警上报 DASH（A-08 聚合）；轨迹出证与纠纷仲裁复用 TICKET（D-02/T-15）；
    - 位置/轨迹手机 GPS 前端直连（不做北斗硬件对接，同 F-02）——骑手端上线后位置心跳由骑手端
      POST /delivery/rider/location 上报（前端可调接口），轨迹存证写入由 DELIVERY 服务端完成，
      不再保留服务端间轨迹上报端点。
  endpoints: []
